  if (tip) tip.style.display = 'none';
}

// ── Render coalescing — debounce rapid onSnapshot cascades ──
var _renderRAF = 0;
var _renderCount = 0;
var _renderWindowStart = 0;
var _RENDER_CAP = 30; // max renders per second — circuit breaker
function scheduleRender() {
  if (_renderRAF) return; // already scheduled
  var now = performance.now();
  if (now - _renderWindowStart > 1000) { _renderCount = 0; _renderWindowStart = now; }
  if (++_renderCount > _RENDER_CAP) {
    console.error('[UI] Circuit breaker: >' + _RENDER_CAP + ' renders/sec — dropping frame');
    return;
  }
  _renderRAF = requestAnimationFrame(function() {
    _renderRAF = 0;
    try { renderOverview(); } catch (e) { console.error('[UI] renderOverview crashed:', e.message, e.stack); }
    try { if (currentProject) { renderDetailTabs(); renderDetailBody(); } } catch (e) { console.error('[UI] renderDetail crashed:', e.message, e.stack); }
    try { updateDataSourceBadges(); } catch (e) { console.error('[UI] updateDataSourceBadges crashed:', e.message, e.stack); }
  });
}

// ══════════════════════════════════════════════════
// LAYER 1: Overview
// ══════════════════════════════════════════════════
function renderOverview() {
  const app = document.getElementById('app');
  let totalDelivs = 0, atRisk = 0, blocked = 0, approaching = 0, stalled = 0;
  projects.forEach(p => {
    const ds = allDeliverables(p);
    totalDelivs += ds.length;
    ds.forEach(d => {
      if (d.status === 'at_risk') atRisk++;
      if (d.status === 'blocked') blocked++;
      if (d.status === 'stalled') stalled++;
    });
    (p.milestones || []).forEach(m => {
      const dr = daysRemaining(m.date);
      if (dr >= 0 && dr <= 14) approaching++;
    });
    if (p.status === 'stalled') stalled++;
  });

  const attentionItems = [];
  projects.forEach(p => {
    const nm = nextMilestone(p);
    const milestoneProx = nm ? daysRemaining(nm.date) : 999;
    const unreadC = unreadCount(p.id);
    if (p.status === 'stalled') {
      const days = p.stalledSince ? daysSince(p.stalledSince) : 0;
      const signals = { status: 'stalled', days_since_update: days, milestone_proximity_days: milestoneProx, unread_comms: unreadC };
      attentionItems.push({ tag:'Stalled', tagClass:'att-stalled', text:`${p.name} — no progress for ${days || '?'} days`, project: p.id, itemId: p.id + '-stalled', signals });
    }
    allDeliverables(p).forEach(d => {
      const ds = daysSince(d.lastUpdate);
      if (d.status === 'at_risk') {
        const signals = { status: 'at_risk', days_since_update: ds || 0, milestone_proximity_days: milestoneProx, unread_comms: unreadC };
        attentionItems.push({ tag:'At Risk', tagClass:'att-risk', text:`${d.id} ${d.title} (${p.name}) — ${ds !== null ? ds + 'd since update' : 'no update yet'}`, project: p.id, itemId: p.id + '-' + d.id + '-risk', signals });
      }
      if (d.status === 'blocked') {
        const signals = { status: 'blocked', days_since_update: ds || 0, milestone_proximity_days: milestoneProx, unread_comms: unreadC };
        attentionItems.push({ tag:'Blocked', tagClass:'att-blocked', text:`${d.id} ${d.title} (${p.name})`, project: p.id, itemId: p.id + '-' + d.id + '-blocked', signals });
      }
    });
  });
  // Baseline proposals: surface as attention items for user approval
  projects.forEach(p => {
    var _ds = _dashboardSummaries[p.id] || {};
    var bProp = p.baselineProposal || _ds.baselineProposal || null;
    if (bProp && bProp.proposed) {
      var signals = { status: 'baseline_proposal', days_since_update: 0, milestone_proximity_days: 999, unread_comms: 0 };
      attentionItems.push({
        tag: 'Baseline', tagClass: 'att-baseline', isBaselineProposal: true,
        text: `${p.name} — ${(bProp.reason || 'structural shift detected').slice(0, 80)}`,
        project: p.id, itemId: p.id + '-baseline-proposal', signals: signals,
        proposalText: bProp.proposed
      });
    }
  });
  // DLE: score and rank attention items
  attentionItems.forEach(item => { item.score = dleScoreAttentionItem(item.signals); });
  attentionItems.sort((a, b) => b.score - a.score);
  attentionItems.forEach((item, i) => { item.rank = i + 1; });

  const totalUnread = unreadCount();

  let html = '';

  // Stat tiles
  // Verification tile — combines sync audit + provenance from DB
  var vsThisRun = (_verifState && _verifState.this_run) || {};
  var vsLastRemoved = vsThisRun.removed_no_provenance || 0;
  var syncAudit = (_lastSyncState && _lastSyncState._selfAudit) || {};
  var auditResult = syncAudit.result || '';
  var auditVerif = syncAudit.verification || {};
  var hasAudit = !!auditResult;
  var hasProvenance = !!(vsThisRun.run_id);
  var hasAny = hasAudit || hasProvenance;
  // Red if either section has issues
  var auditOk = auditResult === 'pass';
  var provOk = vsLastRemoved === 0;
  var verifTileColor = !hasAny ? 'var(--ink-muted)' : ((!auditOk && hasAudit) || !provOk) ? 'var(--status-blocked)' : 'var(--status-on-track)';
  var verifTileValue = !hasAny ? '—' : ((!auditOk && hasAudit) || !provOk) ? '✕' : '✓';
  var verifTileParts = [];
  if (hasAudit) verifTileParts.push('audit: ' + (auditOk ? '✓' : '✕'));
  if (hasProvenance) verifTileParts.push('provenance: ' + (provOk ? '✓' : vsLastRemoved + ' removed'));
  var verifTileSub = hasAny ? verifTileParts.join(' · ') + ' · tap for log' : 'awaiting first run';
  html += renderDataHealth();
  html += `<div class="stat-row">
    <div class="stat-tile"><div class="stat-label">Deliverables</div><div class="stat-value">${totalDelivs}</div><div class="stat-sub">across ${projects.length} projects</div></div>
    <div class="stat-tile"><div class="stat-label">At Risk</div><div class="stat-value" style="color:var(--status-at-risk)">${atRisk}</div><div class="stat-sub">deliverables flagged</div></div>
    <div class="stat-tile"><div class="stat-label">Milestones ≤ 14d</div><div class="stat-value" style="color:var(--status-blocked)">${approaching}</div><div class="stat-sub">approaching deadline</div></div>
    <div class="stat-tile"><div class="stat-label">Unread Comms</div><div class="stat-value" style="color:${totalUnread > 0 ? 'var(--status-blocked)' : 'var(--status-on-track)'}">${totalUnread}</div><div class="stat-sub">${totalUnread > 0 ? 'messages need attention' : 'all caught up'}</div></div>
    <div class="stat-tile" id="verifTile" style="cursor:pointer" title="Click for verification log"><div class="stat-label">Verification</div><div class="stat-value" style="color:${verifTileColor}">${verifTileValue}</div><div class="stat-sub">${verifTileSub}</div></div>
  </div>`;

  // Unread comms banner (high visibility)
  if (totalUnread > 0) {
    html += `<div class="sidebar-unread" style="margin-bottom:16px">
      <span class="comms-badge-overview">${totalUnread}</span>
      <span>${totalUnread} unread message${totalUnread > 1 ? 's' : ''} across projects — open a project to review</span>
    </div>`;
  }

  // DLE Health panel
  html += renderDLEHealth();

  // Provenance alert (only fires on LAST RUN removals, not cumulative)
  if (vsLastRemoved > 0) {
    var alertRunTs = vsThisRun.timestamp ? new Date(vsThisRun.timestamp).toLocaleString('en-GB', {timeZone:TIMEZONE, day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
    html += `<div class="attention-bar" style="border-left:4px solid var(--status-blocked);background:color-mix(in srgb, var(--status-blocked) 8%, var(--surface))">
      <h3 style="color:var(--status-blocked)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 14h14L8 1zm0 4.5v4m0 1.5v1"/></svg>
        Data Integrity Alert — ${vsLastRemoved} Message${vsLastRemoved !== 1 ? 's' : ''} Removed</h3>
      <div class="attention-item" style="border:none;background:transparent">
        Provenance verification removed <strong>${vsLastRemoved} message${vsLastRemoved !== 1 ? 's' : ''}</strong> without valid source provenance.
        ${alertRunTs ? `<span style="font-size:11px;color:var(--ink-muted);margin-left:8px">Run: ${alertRunTs}</span>` : ''}
      </div>
    </div>`;
  }

  // Filter out dismissed items (dismissed less than 24h ago stays dismissed)
  const activAttention = attentionItems.filter(a => {
    var dismissedAt = _dismissedItems[a.itemId];
    if (!dismissedAt) return true;
    // Auto-resurface after 24h
    return (Date.now() - dismissedAt) > 86400000;
  });

  // Drift detection: inject drift alerts into attention items
  const driftItems = obsDriftCheck();
  driftItems.forEach(d => { d.score = 999; d.rank = 0; }); // drift always on top

  // Resource clustering detection: flag milestone pile-ups
  const clusterItems = obsClusterCheck();
  clusterItems.forEach(c => { c.score = 998; c.rank = 0; }); // cluster just below drift

  // Attention bar (DLE-ranked with capture hooks)
  attentionRenderTs = Date.now(); // timestamp for time-to-action measurement
  const allAttention = [...driftItems, ...clusterItems, ...activAttention];
  if (allAttention.length) {
    html += `<div class="attention-bar"><h3>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 14h14L8 1zm0 4.5v4m0 1.5v1"/></svg>
      Needs Attention (${allAttention.length})<span id="fbAttention">${obsFreshnessBadge(['slack','teams','email','sharepoint'])}</span></h3>`;
    // Store signals in a lookup for safe onclick access
    window._attSignals = {};
    function renderAttItem(a) {
      window._attSignals[a.itemId] = a.signals;
      if (a.isDrift) {
        return `<div class="attention-item att-item att-drift">
          <span class="att-tag" style="background:var(--accent);color:#fff">⚡ ${a.tag}</span>${a.text}
          <span style="margin-left:auto;display:flex;gap:4px;flex-shrink:0">
            <button class="btn btn-sm" data-drift-confirm="${a.driftKey}" style="font-size:10px;padding:2px 8px">Keep</button>
            <button class="btn btn-sm" data-drift-reset="${a.driftKey}" style="font-size:10px;padding:2px 8px">Reset</button>
          </span>
        </div>`;
      }
      if (a.isBaselineProposal) {
        return `<div class="attention-item att-item" data-att-item="${a.itemId}" data-att-project="${a.project}" data-att-rank="${a.rank || 0}">
          <span class="att-tag ${a.tagClass}">◈ ${a.tag}</span>${a.text}
          <span class="baseline-proposal-actions">
            <button class="btn btn-sm" style="background:var(--accent);color:#fff;border-color:transparent;font-size:10px;padding:2px 8px" data-baseline-accept="${a.project}">Accept</button>
            <button class="btn btn-sm" style="font-size:10px;padding:2px 8px" data-baseline-dismiss="${a.project}">Dismiss</button>
          </span>
        </div>`;
      }
      if (a.isCluster) {
        return `<div class="attention-item att-item att-cluster" data-att-item="${a.itemId}" data-att-project="${a.project}" data-att-rank="0">
          <span class="att-tag ${a.tagClass}">⚠ ${a.tag}</span>${a.text}
          <span class="att-dismiss" data-att-item="${a.itemId}" data-att-project="${a.project}" data-att-rank="0" title="Dismiss">✕</span>
        </div>`;
      }
      return `<div class="attention-item att-item" data-att-item="${a.itemId}" data-att-project="${a.project}" data-att-rank="${a.rank}">
        <span class="att-rank">#${a.rank}</span><span class="att-tag ${a.tagClass}">${a.tag}</span>${a.text}
        <span class="att-dismiss" data-att-item="${a.itemId}" data-att-project="${a.project}" data-att-rank="${a.rank}" title="Dismiss">✕</span>
      </div>`;
    }
    allAttention.slice(0, 8).forEach(a => { html += renderAttItem(a); });
    if (allAttention.length > 8) {
      var extra = allAttention.slice(8);
      html += `<div id="attOverflow" hidden>`;
      extra.forEach(a => { html += renderAttItem(a); });
      html += `</div>`;
      html += `<div class="attention-item" style="color:var(--accent);cursor:pointer" data-action="att-show-more">+ ${extra.length} more — click to expand</div>`;
    }
    html += '</div>';
  }

  // Cross-project milestone timeline
  html += renderMilestoneTimeline();

  // Two-column layout: projects left, calendar right
  html += '<div class="overview-columns">';

  // Left: project cards
  html += `<div><div class="section-label">Projects<span id="fbProjects">${obsFreshnessBadge(['slack','teams','email','sharepoint','gitlab'])}</span><span class="data-source-badge"></span></div><div class="project-grid">`;
  projects.forEach(p => {
    const ds = allDeliverables(p);
    const counts = countByStatus(ds);
    const nm = nextMilestone(p);
    const dr = daysRemaining(nm.date);
    const pu = unreadCount(p.id);

    html += `<div class="project-card" tabindex="0" role="button" aria-label="View ${p.name} details" data-project-id="${p.id}">
      <div class="pc-header">
        <div>
          <div class="pc-name">${p.name}${pu > 0 ? ` <span class="comms-badge-overview">${pu}</span>` : ''} ${dbIndicatorHtml(p.id)}</div>
          ${p.code ? `<div class="pc-code">${p.code} · ${p.prime}</div>` : `<div class="pc-code">${p.prime}</div>`}
          <div class="pc-sources">${p.stream ? `<span class="src-stream">${p.stream}</span>` : ''}${(p.dataSources||[]).map(s => `<span class="src-icon" title="${s}">${{slack:'💬',email:'📧',teams:'🟣',sharepoint:'📁',calendar:'📅',wiki:'📝'}[s]||s}</span>`).join('')}${(p.dataSources||[]).length === 0 ? '<span style="font-size:10px;color:var(--ink-faint)">no sources configured</span>' : ''}</div>
        </div>
        <span class="status-chip status-${p.status}"><span class="dot"></span>${statusLabel(p.status)}</span>
      </div>
      <div class="pc-milestone">
        <div class="ms-label">Next: <strong>${nm.id}</strong> · ${nm.name}</div>
        <div class="ms-days ${severityClass(dr)}">${dr === 0 ? 'Today' : dr > 0 ? dr + 'd' : Math.abs(dr) + 'd ago'}</div>
      </div>
      <div class="pc-deliv-bar">
        ${counts.delivered ? `<div style="flex:${counts.delivered};background:var(--status-delivered)"></div>` : ''}
        ${counts.on_track ? `<div style="flex:${counts.on_track};background:var(--status-on-track)"></div>` : ''}
        ${counts.at_risk ? `<div style="flex:${counts.at_risk};background:var(--status-at-risk)"></div>` : ''}
        ${counts.blocked ? `<div style="flex:${counts.blocked};background:var(--status-blocked)"></div>` : ''}
        ${counts.stalled ? `<div style="flex:${counts.stalled};background:var(--status-stalled)"></div>` : ''}
      </div>
      <div class="pc-deliv-counts">
        ${counts.delivered ? `<span><span class="cdot" style="background:var(--status-delivered)"></span>${counts.delivered} delivered</span>` : ''}
        ${counts.on_track ? `<span><span class="cdot" style="background:var(--status-on-track)"></span>${counts.on_track} on track</span>` : ''}
        ${counts.at_risk ? `<span><span class="cdot" style="background:var(--status-at-risk)"></span>${counts.at_risk} at risk</span>` : ''}
        ${counts.blocked ? `<span><span class="cdot" style="background:var(--status-blocked)"></span>${counts.blocked} blocked</span>` : ''}
        ${counts.stalled ? `<span><span class="cdot" style="background:var(--status-stalled)"></span>${counts.stalled} stalled</span>` : ''}
      </div>
    </div>`;
  });
  html += '</div></div>';

  // Right: calendar sidebar
  html += '<div>';
  html += '<div class="section-label">Calendar</div>';
  html += renderCalendarSidebar();
  html += '</div>';

  html += '</div>'; // close overview-columns

  html += '<div class="site-footer">Portfolio Dashboard · Live prototype · Agents: AGT-COORD · AGT-PULL · AGT-SYNTHESIZE · AGT-DLE · AGT-VERIFIER<br><span style="font-size:10px;color:var(--ink-faint)">Data sources: Slack · Teams · M365 Email · M365 Calendar · SharePoint · Obsidian · SharePoint LocalSync</span></div>';
  _renderCount++;
  console.log('[RENDER] renderOverview #' + _renderCount + ' — driftItems in attention:', allAttention.filter(function(a){return a.isDrift;}).length);
  app.innerHTML = html;
  // Flush expired drift confirmations AFTER DOM update (no side effect during render)
  if (_expiredDriftConfirms.length) {
    var cdClone = Object.assign({}, dleState.confirmedDrifts);
    _expiredDriftConfirms.forEach(function(k) { delete cdClone[k]; });
    dleState.confirmedDrifts = cdClone;
    console.log('[DRIFT] Flushed expired confirms:', _expiredDriftConfirms.join(', '));
    _expiredDriftConfirms = [];
  }
}

function renderCalendarSidebar() {
  const calTodayFmt = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  let html = `<div class="sidebar-card">
    <h3>Upcoming Events<span id="fbCalendar">${obsFreshnessBadge(['m365cal'])}</span></h3>
    <div style="font-size:11px;color:var(--ink-muted);margin:-6px 0 8px">Today: ${calTodayFmt} · EET/EEST</div>`;

  // Group by day — only today and future events
  const byDay = {};
  calendarEvents.forEach(e => {
    if (e.date < TODAY_STR) return; // skip past events
    if (!byDay[e.date]) byDay[e.date] = [];
    byDay[e.date].push(e);
  });

  const dayLabels = { 0:'Sun',1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat' };
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Show next 5 days of events (today first)
  let daysShown = 0;
  const sortedDates = Object.keys(byDay).sort();
  for (const dateStr of sortedDates) {
    if (daysShown >= 5) break;
    const d = new Date(dateStr + 'T00:00:00');
    const isToday = dateStr === TODAY_STR;
    const dayLabel = isToday ? 'Today' : `${dayLabels[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}`;

    html += `<div class="cal-day-group"><div class="cal-day-label">${dayLabel}</div>`;
    // Sort events within a day by time
    byDay[dateStr].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    byDay[dateStr].forEach(ev => {
      const col = ev.project ? projectColor(ev.project) : 'var(--ink-muted)';
      html += `<div class="cal-event">
        <div class="cal-event-dot" style="background:${col}"></div>
        <div class="cal-event-time">${ev.time}</div>
        <div class="cal-event-body">
          <div class="cal-event-title">${ev.title}</div>
          <div class="cal-event-meta">${ev.duration} · ${ev.location}${ev.attendees ? ' · ' + ev.attendees : ''}</div>
        </div>
      </div>`;
    });
    html += '</div>';
    daysShown++;
  }

  if (sortedDates.length === 0) {
    html += '<div style="text-align:center;padding:16px;color:var(--ink-muted);font-size:12px">No upcoming events</div>';
  }

  html += '</div>';
  return html;
}

// LAYER 2: Detail panel with tabs

let currentProject = null; // string project ID or null
function getProject(id) { return projects.find(function(p) { return p.id === (id || currentProject); }); }
let currentTab = 'deliverables';

function renderMetaRow(p) {
  const items = [];
  if (p.code) items.push(`<span class="meta-item"><span class="meta-label">Code</span> <span class="meta-value editable" data-edit-field="code" data-project="${p.id}">${p.code}</span></span>`);
  else items.push(`<span class="meta-item"><span class="meta-value editable" data-edit-field="code" data-project="${p.id}" style="opacity:0.4">+ code</span></span>`);
  if (p.prime) items.push(`<span class="meta-item"><span class="meta-label">Prime</span> <span class="meta-value editable" data-edit-field="prime" data-project="${p.id}">${p.prime}</span></span>`);
  else items.push(`<span class="meta-item"><span class="meta-value editable" data-edit-field="prime" data-project="${p.id}" style="opacity:0.4">+ prime</span></span>`);
  if (p.contract) items.push(`<span class="meta-item"><span class="meta-label">Contract</span> <span class="meta-value editable" data-edit-field="contract" data-project="${p.id}">${p.contract}</span></span>`);
  if (p.stream) items.push(`<span class="meta-item"><span class="meta-label">Stream</span> <span class="meta-value editable" data-edit-field="stream" data-project="${p.id}">${p.stream}</span></span>`);
  const prioLabel = p.priority != null ? 'P' + p.priority : '—';
  items.push(`<span class="meta-item"><span class="meta-label">Priority</span> <span class="dp-priority-chip editable" data-edit-field="priority" data-project="${p.id}">${prioLabel}</span></span>`);
  return `<div class="meta-row">${items.join('')}</div>`;
}

function openDetail(projectId) {
  const p = projects.find(x => x.id === projectId);
  if (!p) { console.warn('[UI] openDetail: project not found:', projectId, '| available:', projects.map(x => x.id).join(',')); return; }
  currentProject = p.id;
  currentTab = 'deliverables';

  document.getElementById('dpTitle').textContent = p.name;
  // Metadata row: code, prime, contract, stream, priority — each editable
  document.getElementById('dpSubtitle').innerHTML = renderMetaRow(p);
  document.getElementById('dpStatus').innerHTML = `${dbIndicatorHtml(p.id)} <span class="status-chip status-${p.status}" style="cursor:pointer" data-edit-status="${p.id}"><span class="dot"></span>${statusLabel(p.status)}</span>`;

  renderDetailTabs();
  renderDetailBody();

  console.log('[UI] openDetail: opening panel for', p.id, p.name);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderDetailTabs() {
  const p = getProject();
  if (!p) return;
  const unread = unreadCount(p.id);
  const tabs = [
    { id: 'deliverables', label: 'Deliverables' },
    { id: 'gantt', label: 'Gantt' },
    { id: 'comms', label: 'Comms', badge: unread > 0 ? unread : null },
    { id: 'activity', label: 'Activity' },
    { id: 'sources', label: 'Sources' },
  ];

  document.getElementById('dpTabs').innerHTML = tabs.map(t =>
    `<button class="dp-tab${currentTab === t.id ? ' active' : ''}" data-tab="${t.id}">${t.label}${t.badge ? ` <span class="tab-badge">${t.badge}</span>` : ''}</button>`
  ).join('');
}

function switchTab(tabId) {
  currentTab = tabId;
  renderDetailTabs();
  renderDetailBody();
}

function renderDetailBody() {
  const p = getProject();
  if (!p) return;
  let body = '';
  body += '<div style="margin-bottom:16px;display:flex;flex-direction:column;gap:6px">';
  // Resolve summaries: project object first, then dashboard cache, then notes fallback
  var _ds = _dashboardSummaries[p.id] || {};
  const baseline = p.summaryBaseline || _ds.summaryBaseline || p.notes || '';
  const recentSummary = p.summaryRecent != null ? p.summaryRecent : (_ds.summaryRecent != null ? _ds.summaryRecent : '');
  // Baseline: sticky phase state — click to edit
  body += `<div class="editable" data-edit-summary="baseline" data-project="${p.id}" style="font-size:13px;color:var(--ink-secondary);padding:10px 14px;background:var(--surface-hover);border-radius:var(--radius-sm);line-height:1.5;min-height:36px">${baseline || '<span style="opacity:0.4">Awaiting next scout run…</span>'}</div>`;
  // Weekly log: collapsible timeline of weekly digests between baseline and recent
  const weeklyLog = p.weeklyLog || (_ds.weeklyLog) || [];
  if (weeklyLog.length > 0) {
    const logId = 'wlog-' + p.id;
    body += `<div class="weekly-log-wrap">`;
    body += `<div class="weekly-log-toggle" onclick="(function(e){var t=e.currentTarget;t.classList.toggle('expanded');document.getElementById('${logId}').classList.toggle('open')})(event)">`;
    body += `<svg viewBox="0 0 12 12" fill="currentColor"><path d="M4 2l5 4-5 4V2z"/></svg>`;
    body += `Weekly Log (${weeklyLog.length})`;
    body += `</div>`;
    body += `<div id="${logId}" class="weekly-log-entries">`;
    // Entries should already be newest-first from agent; enforce sort just in case
    const sorted = [...weeklyLog].sort((a, b) => (b.week || '').localeCompare(a.week || ''));
    sorted.forEach(entry => {
      body += `<div class="weekly-log-entry"><span class="weekly-log-week">${entry.week || '?'}</span><span class="weekly-log-text">${entry.summary || ''}</span></div>`;
    });
    body += `</div></div>`;
  }
  // Baseline proposal alert (if agent proposed a structural shift)
  const bProp = p.baselineProposal || (_ds.baselineProposal) || null;
  if (bProp && bProp.proposed) {
    body += `<div style="font-size:12px;padding:8px 14px;background:var(--accent-wash);border-radius:var(--radius-sm);border-left:3px solid var(--accent);line-height:1.5">`;
    body += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent)">Baseline Proposal</span>`;
    body += `<span style="font-size:10px;color:var(--ink-muted)">${bProp.reason || ''}</span></div>`;
    body += `<div style="color:var(--ink-secondary);margin-bottom:6px">${bProp.proposed}</div>`;
    body += `<div class="baseline-proposal-actions">`;
    body += `<button class="btn btn-sm" style="background:var(--accent);color:#fff;border-color:transparent" data-baseline-accept="${p.id}">Accept</button>`;
    body += `<button class="btn btn-sm" data-baseline-dismiss="${p.id}">Dismiss</button>`;
    body += `</div></div>`;
  }
  // Recent: rolling 14-day digest — click to edit
  body += `<div class="editable" data-edit-summary="recent" data-project="${p.id}" style="font-size:12px;color:var(--ink-muted);padding:8px 14px;background:var(--accent-wash);border-radius:var(--radius-sm);border-left:3px solid var(--accent);line-height:1.5;min-height:30px"><span style="font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent);margin-right:6px">Recent</span>${recentSummary || '<span style="opacity:0.4">Awaiting next scout run…</span>'}</div>`;
  body += '</div>';

  // Partner Pulse section
  const pa = partnerActivity[p.id];
  if (pa && Object.keys(pa).length > 0) {
    body += '<div class="partner-pulse">';
    body += '<div class="partner-pulse-title">Partner Pulse</div>';
    body += '<div class="partner-pulse-grid">';
    // Sort: quiet partners first (most urgent), then by recency
    const entries = Object.entries(pa).sort((a, b) => {
      const dA = a[1].lastSeen ? daysSince(a[1].lastSeen) : 999;
      const dB = b[1].lastSeen ? daysSince(b[1].lastSeen) : 999;
      return dB - dA; // quietest first
    });
    entries.forEach(([name, info]) => {
      const days = info.lastSeen ? daysSince(info.lastSeen) : null;
      let dotClass, metaHtml;
      if (days === null) {
        dotClass = 'unknown';
        metaHtml = '<span style="opacity:0.5">No signal</span>';
      } else if (days >= PARTNER_QUIET_CRIT) {
        dotClass = 'quiet';
        metaHtml = `<span class="quiet-tag">${days}d quiet</span>`;
      } else if (days >= PARTNER_QUIET_WARN) {
        dotClass = 'warn';
        metaHtml = `<span class="warn-tag">${days}d</span>`;
      } else {
        dotClass = 'active';
        metaHtml = days === 0 ? 'Today' : `${days}d ago`;
      }
      const srcIcon = info.source === 'email' ? '✉' : info.source === 'teams' ? '◆' : info.source === 'slack' ? '#' : info.source === 'sharepoint' ? '📂' : info.source === 'wiki' ? '📝' : '';
      const quietDays = days || 0;
      body += `<div class="partner-pulse-row" title="${info.subject || 'No activity recorded'}" data-partner-name="${name.replace(/'/g,'&#39;')}" data-partner-id="${p.id}" data-partner-days="${quietDays}" style="cursor:pointer">
        <div class="partner-pulse-dot ${dotClass}"></div>
        <div class="partner-pulse-name">${name}</div>
        <div class="partner-pulse-meta">${srcIcon} ${metaHtml}</div>
      </div>`;
    });
    body += '</div></div>';
  }

  if (currentTab === 'deliverables') {
    body += renderDeliverablesTab(p);
  } else if (currentTab === 'gantt') {
    body += renderGanttTab(p);
  } else if (currentTab === 'comms') {
    body += renderCommsTab(p);
  } else if (currentTab === 'activity') {
    body += renderActivityTab(p);
  } else if (currentTab === 'sources') {
    body += renderSourcesTab(p);
  }

  document.getElementById('dpBody').innerHTML = body;

  // Post-render hooks
  if (currentTab === 'gantt') {
    initGanttInteractions();
  }
}

// ── Deliverables tab ──
function renderDeliverablesTab(p) {
  let html = '';
  (p.milestones || []).forEach(m => {
    const dr = daysRemaining(m.date);
    html += `<div class="milestone-section">
      <div class="ms-header">
        <h3>${m.id} — ${m.name} <span class="ms-date-chip">${m.date} · <span class="${severityClass(dr)}">${dr === 0 ? 'Today' : dr > 0 ? dr + ' days' : Math.abs(dr) + 'd overdue'}</span></span></h3>
      </div>
      <div class="table-wrap"><table class="deliv-table">
        <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Updated</th><th style="text-align:right">Days</th><th>Verif.</th><th>Actions</th></tr></thead><tbody>`;
    (m.deliverables || []).forEach(d => {
      const ds = daysSince(d.lastUpdate);
      const verifHtml = d.verification === 'pass' ? '<span class="verif-badge verif-pass">T-PASS</span>'
        : d.verification === 'fail' ? '<span class="verif-badge verif-fail">T-FAIL</span>'
        : d.verification === 'warn' ? '<span class="verif-badge verif-warn">T-WARN</span>'
        : '<span class="verif-badge verif-none">—</span>';
      html += `<tr>
        <td class="deliv-id">${d.id}</td>
        <td class="deliv-title">${d.title}</td>
        <td><span class="status-chip status-${d.status} editable" data-edit-deliv-status="${d.id}" data-project="${p.id}" title="Click to change status"><span class="dot"></span>${statusLabel(d.status)}</span></td>
        <td style="font-size:12px;color:var(--ink-muted);white-space:nowrap">${d.lastUpdate || '—'}${d.source ? `<br><span style="font-size:10px">${d.source}</span>` : ''}</td>
        <td class="days-val ${daysClass(ds)}">${ds !== null ? ds + 'd' : '—'}</td>
        <td>${verifHtml}</td>
        <td class="deliv-actions">
          ${d.status !== 'delivered' ? `<button class="btn btn-sm" data-deliv-id="${d.id}" data-deliv-action="delivered">Deliver</button>` : ''}
          ${d.status !== 'blocked' && d.status !== 'delivered' ? `<button class="btn btn-sm btn-danger" data-deliv-id="${d.id}" data-deliv-action="blocked">Block</button>` : ''}
          ${d.status !== 'delivered' ? `<button class="btn btn-sm" data-verify-id="${d.id}">Verify</button>` : ''}
        </td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  });
  return html;
}

// ── Gantt tab ──
function renderGanttTab(p) {
  const gd = _dbGanttData[p.id] || ganttData[p.id]; // DB config wins; hardcoded is fallback for non-migrated projects
  if (!gd) return '<div style="text-align:center;padding:40px;color:var(--ink-muted)">No Gantt data available for this project.</div>';

  const t0 = new Date(gd.t0);
  const tEnd = new Date(gd.tEnd);
  const totalDays = daysBetween(gd.t0, gd.tEnd);

  // Build month columns
  const months = [];
  let cur = new Date(t0.getFullYear(), t0.getMonth(), 1);
  while (cur <= tEnd) {
    const mStart = new Date(Math.max(cur.getTime(), t0.getTime()));
    const mEndDate = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
    const mEnd = new Date(Math.min(mEndDate.getTime(), tEnd.getTime()));
    const mDays = daysBetween(mStart.toISOString().slice(0,10), mEnd.toISOString().slice(0,10)) + 1;
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    months.push({ label: monthNames[cur.getMonth()] + ' ' + cur.getFullYear(), days: mDays, startDate: mStart });
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }

  function dateToPercent(dateStr) {
    const d = daysBetween(gd.t0, dateStr);
    return Math.max(0, Math.min(100, (d / totalDays) * 100));
  }

  let html = '<div class="gantt-container"><div class="gantt">';

  // Month header
  html += '<div class="gantt-header">';
  months.forEach(m => {
    const w = (m.days / totalDays) * 100;
    html += `<div class="gantt-month" style="flex:0 0 ${w}%">${m.label}</div>`;
  });
  html += '</div>';

  // Body
  html += '<div class="gantt-body" id="ganttBody">';

  // Grid lines at month boundaries
  let accDays = 0;
  months.forEach((m, i) => {
    if (i > 0) {
      const pct = (accDays / totalDays) * 100;
      html += `<div class="gantt-grid-line" style="left:calc(210px + (100% - 210px) * ${pct / 100})"></div>`;
    }
    accDays += m.days;
  });

  // Today line
  const todayPct = dateToPercent(TODAY_STR);
  if (todayPct >= 0 && todayPct <= 100) {
    const todayDate = new Date(TODAY_STR);
    const todayFmt = todayDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const todayFull = todayDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    html += `<div class="gantt-today-line" style="left:calc(210px + (100% - 210px) * ${todayPct / 100})" title="${todayFull}">
      <div class="gantt-today-label">Today · ${todayFmt}</div>
    </div>`;
  }

  // WP rows
  gd.workPackages.forEach(wp => {
    const wpLeft = dateToPercent(wp.start);
    const wpRight = dateToPercent(wp.end);
    const wpWidth = wpRight - wpLeft;

    // Parent row
    html += `<div class="gantt-row wp-parent">
      <div class="gantt-row-label" title="${wp.id}: ${wp.name}${wp.owner ? ' — ' + wp.owner : ''}"><span class="gl-name">${wp.id}: ${wp.name}</span>${wp.owner ? `<span class="gl-owner">${wp.owner}</span>` : ''}</div>
      <div class="gantt-row-track">
        <div class="gantt-bar" style="left:${wpLeft}%;width:${wpWidth}%;background:${wp.color}" data-tooltip="${wp.id}: ${wp.name}${wp.owner ? '\nOwner: ' + wp.owner : ''}\n${wp.start} → ${wp.end}\nProgress: ${Math.round(wp.progress*100)}%">
          <div class="gantt-bar-progress" style="width:${wp.progress*100}%;background:${wp.color}"></div>
        </div>
      </div>
    </div>`;

    // Children
    if (wp.children) {
      wp.children.forEach(ch => {
        const cLeft = dateToPercent(ch.start);
        const cRight = dateToPercent(ch.end);
        const cWidth = cRight - cLeft;
        html += `<div class="gantt-row">
          <div class="gantt-row-label" title="${ch.id}: ${ch.name}${ch.owner ? ' — ' + ch.owner : ''}"><span class="gl-name">${ch.id}: ${ch.name}</span>${ch.owner ? `<span class="gl-owner">${ch.owner}</span>` : ''}</div>
          <div class="gantt-row-track">
            <div class="gantt-bar" style="left:${cLeft}%;width:${cWidth}%;background:${wp.color}" data-tooltip="${ch.id}: ${ch.name}${ch.owner ? '\nOwner: ' + ch.owner : ''}\n${ch.start} → ${ch.end}\nProgress: ${Math.round(ch.progress*100)}%">
              <div class="gantt-bar-progress" style="width:${ch.progress*100}%;background:${wp.color}"></div>
            </div>
          </div>
        </div>`;
      });
    }
  });

  // Milestone row
  html += '<div class="gantt-row wp-parent" style="height:40px;border-bottom:none">';
  html += '<div class="gantt-row-label" style="font-weight:600;color:var(--ink-primary)">Milestones</div>';
  html += '<div class="gantt-row-track" style="position:relative">';
  (gd.milestones || []).forEach(ms => {
    const msPct = dateToPercent(ms.date);
    const isPast = new Date(ms.date) <= TODAY;
    const isDelivered = dleState.milestoneDeliveries.find(d => d.milestone_id === ms.id);
    html += `<div class="gantt-milestone${isPast ? ' past' : ''}${isDelivered ? ' delivered' : ''}" style="left:${msPct}%" data-tooltip="${ms.id}: ${ms.name}\n${ms.date}${isDelivered ? '\n✓ Delivered ' + isDelivered.actual_date : (isPast ? '\n(Completed)' : '')}"
      data-ms-id="${ms.id}" data-ms-name="${ms.name.replace(/'/g,'&#39;')}" data-ms-date="${ms.date}" data-ms-project="${p.id}"></div>`;
  });
  html += '</div></div>';

  html += '</div>'; // gantt-body
  html += '</div>'; // gantt

  // Legend
  html += '<div class="gantt-legend">';
  gd.workPackages.forEach(wp => {
    html += `<div class="gantt-legend-item"><div class="gantt-legend-swatch" style="background:${wp.color}"></div>${wp.id}</div>`;
  });
  html += `<div class="gantt-legend-item"><div class="gantt-legend-diamond"></div>Milestone</div>`;
  html += `<div class="gantt-legend-item"><div style="width:12px;height:2px;background:var(--status-blocked);border-radius:1px"></div>Today</div>`;
  html += '</div>';

  html += '</div>'; // gantt-container
  return html;
}

function initGanttInteractions() {
  const tooltip = document.getElementById('ganttTooltip');
  document.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tooltip.textContent = el.getAttribute('data-tooltip');
      tooltip.style.display = 'block';
      const rect = el.getBoundingClientRect();
      tooltip.style.left = rect.left + 'px';
      tooltip.style.top = (rect.top - tooltip.offsetHeight - 8) + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

// ── Comms tab ──
let commsFilter = 'all'; // all | review | info | unread

function renderCommsTab(p) {
  const msgs = commsMessages.filter(m => m.project === p.id);
  const activeCount = msgs.filter(m => !m.acked).length;
  const reviewCount = msgs.filter(m => m.flag === 'review' && !m.acked).length;
  const ackedCount = msgs.filter(m => m.acked).length;
  const OWNER_EMAIL_F = 'you@example.com';
  const sentCount = msgs.filter(m => m.direction === 'outbound' && (m.from || '').toLowerCase() === OWNER_EMAIL_F).length;

  let html = '<div class="comms-feed">';

  // Filter row
  html += '<div class="comms-filter-row">';
  const filters = [
    { id: 'all', label: `Active (${activeCount})` },
    { id: 'sent', label: `Sent (${sentCount})` },
    { id: 'review', label: `Review (${reviewCount})` },
    { id: 'info', label: 'Information' },
    { id: 'acked', label: `Acknowledged (${ackedCount})` },
  ];
  filters.forEach(f => {
    html += `<button class="comms-filter${commsFilter === f.id ? ' active' : ''}" data-comms-filter="${f.id}">${f.label}</button>`;
  });
  if (commsFilter !== 'acked' && commsFilter !== 'sent') {
    html += `<button class="comms-filter ack-all-btn" data-ack-all="${p.id}" title="Acknowledge every message currently shown" style="margin-left:auto">✓ Ack all shown</button>`;
  }
  html += '</div>';

  // Filtered messages — hide acknowledged by default
  let filtered;
  if (commsFilter === 'acked') filtered = msgs.filter(m => m.acked);
  else if (commsFilter === 'review') filtered = msgs.filter(m => m.flag === 'review' && !m.acked);
  else if (commsFilter === 'sent') filtered = msgs.filter(m => m.direction === 'outbound' && (m.from || '').toLowerCase() === OWNER_EMAIL_F);
  else if (commsFilter === 'info') filtered = msgs.filter(m => m.flag === 'info' && !m.acked);
  else filtered = msgs.filter(m => !m.acked); // 'all' = active only

  if (filtered.length === 0) {
    html += '<div style="text-align:center;padding:30px;color:var(--ink-muted);font-size:13px">No messages matching this filter.</div>';
  }

  filtered.sort((a,b) => new Date(b.time) - new Date(a.time));

  filtered.forEach(m => {
    // Only treat as truly outbound if sent by the owner (not just a same-org colleague)
    const OWNER_EMAIL = 'you@example.com';
    const isOutbound = m.direction === 'outbound' && (m.from || '').toLowerCase() === OWNER_EMAIL;
    const _isEmail = m.source === 'email' || m.source === 'outlook';
    const sourceClass = _isEmail ? 'source-email' : m.source === 'slack' ? 'source-slack' : m.source === 'jira' ? 'source-jira' : 'source-teams';
    const sourceIcon = isOutbound ? '↗' : (_isEmail ? 'E' : m.source === 'slack' ? 'S' : m.source === 'jira' ? 'J' : 'T');
    const bgColor = isOutbound ? 'var(--status-on-track)' : (_isEmail ? 'var(--status-delivered)' : m.source === 'slack' ? '#611f69' : m.source === 'jira' ? '#0052cc' : '#5050c8');
    const flagStr = typeof m.flag === 'string' ? m.flag : (m.flag ? 'review' : 'info');
    const flagClass = (flagStr === 'review' || flagStr === 'action') ? 'flag-review' : 'flag-info';
    const _t = (m.time || m.date || '').split(' ');
    const timeStr = _t[1] || _t[0] || '';
    const dateStr = _t[0] || '';
    const isToday = dateStr === TODAY_STR;
    const msgClass = isOutbound ? ' outbound' : (!m.acked ? ' unread' : ' acked');
    const fromLabel = isOutbound ? ('To: ' + (m.to || m.subject || '…')) : m.from;

    html += `<div class="comms-msg${msgClass}">
      <div class="comms-msg-icon" style="background:${bgColor}">${sourceIcon}</div>
      <div class="comms-msg-body">
        <div class="comms-msg-header">
          <span class="comms-msg-from">${_escHtml(fromLabel)}</span>
          ${isOutbound ? '<span class="direction-sent">sent</span>' : ''}
          <span class="comms-msg-source ${sourceClass}">${_escHtml(m.source)}</span>
          <span class="comms-msg-flag ${flagClass}">${_escHtml(flagStr)}</span>
          ${m._corrFlagged ? '<span class="corr-flag" title="Project assignment uncertain — verify">⚠ ambiguous</span>' : ''}
          ${m._mentioned ? '<span class="mention-badge" title="You are tagged in this message">@ You</span>' : ''}
          ${m._movedFrom ? '<span class="moved-from-tag" title="Moved from ' + (projects.find(pp => pp.id === m._movedFrom) || {}).name + '">&larr; ' + ((projects.find(pp => pp.id === m._movedFrom) || {}).code || m._movedFrom) + '</span>' : ''}
          ${m._corr && m._corr.confidence === 'high' ? '' : m._corr && m._corr.method ? `<span class="corr-method" title="Correlation: ${m._corr.method}">${m._corr.method}</span>` : ''}
          ${m.lang ? `<span class="comms-msg-lang">${m.lang}</span>` : ''}
          <span class="comms-msg-time">${isToday ? timeStr : dateStr + ' ' + timeStr}</span>
        </div>
        <div style="font-size:13px;font-weight:500;margin-bottom:3px">${_escHtml(m.subject)}</div>
        <div class="comms-msg-text">${_escHtml(m.body)}</div>
        <div class="comms-msg-actions">
          ${m.acked
            ? `<span class="ack-btn acked"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l3 3 7-7"/></svg>Acknowledged</span><span class="ack-stamp">${m.ackedAt || ''}</span>`
            : `<button class="ack-btn" data-ack-msg="${m.id}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="pointer-events:none"><path d="M3 8l3 3 7-7"/></svg>Acknowledge</button>`
          }
          ${(() => {
            const info = buildSourceInfo(m);
            const isEmail = m.source === 'email' || m.source === 'outlook';
            const appName = isEmail ? 'Outlook' : m.source === 'slack' ? 'Slack' : 'Teams';
            const icon = isEmail && !m.sourceUrl
              ? '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 5l6 4 6-4"/></svg>'
              : '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3H3v10h10v-3"/><path d="M9 2h5v5"/><path d="M14 2L7 9"/></svg>';
            const label = isEmail && !m.sourceUrl ? 'Find in Outlook' : 'Open in ' + appName;
            return info
              ? `<button class="open-source-btn" data-open-msg="${m.id}" title="${label}">${icon}${label}</button>`
              : '';
          })()}
          <div class="move-to-wrap">
            <button class="move-to-btn" data-move-msg="${m.id}" title="Move to another project">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M10 5l3 3-3 3"/></svg>
              Move to&hellip;
            </button>
            <div class="move-to-dropdown" id="mtd-${m.id}">
              ${projects.filter(pp => pp.status !== 'archived').map(pp => {
                const isCurrent = pp.id === p.id;
                return '<div class="move-to-option' + (isCurrent ? ' current' : '') + '" data-move-target="' + pp.id + '" data-move-src="' + m.id + '">'
                  + '<span class="mto-dot" style="background:' + (pp.color || 'var(--ink-faint)') + '"></span>'
                  + '<span class="mto-label">' + (pp.code || pp.name) + '</span>'
                  + (isCurrent ? '<span class="mto-current-tag">current</span>' : '')
                  + '</div>';
              }).join('')}
              <div class="move-to-option" data-move-target="_ambiguous" data-move-src="${m.id}">
                <span class="mto-dot" style="background:var(--ink-muted)"></span>
                <span class="mto-label">Ambiguous</span>
              </div>
            </div>
          </div>
          <button class="reject-btn" data-reject-msg="${m.id}" title="Reject — remove with justification">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>

// Build open-in-source info for a message
// Returns { url, protocol, fallbackUrl } — protocol links open desktop apps
function buildSourceInfo(m) {
  if (m.sourceUrl) return { url: m.sourceUrl, protocol: null, fallbackUrl: null };

  var src = (m.source || '').toLowerCase();
  var subj = encodeURIComponent(m.subject || '');

  if (src === 'email' || src === 'outlook') {
    // Primary: OWA search URL (works if "Open in desktop app" is enabled in Outlook settings)
    // The user can also Ctrl+click to stay in browser if needed
    return {
      url: 'https://outlook.office365.com/mail/search/' + subj,
      protocol: 'ms-outlook:',  // fallback: just opens Outlook Classic
      fallbackUrl: 'https://outlook.office365.com/mail/search/' + subj
    };
  }

  if (src === 'teams') {
    if (m.teamsMessageId && m.teamsChatId) {
      return { url: 'https://teams.microsoft.com/_#/conversations/' + m.teamsChatId + '?ctx=chat&messageId=' + m.teamsMessageId, protocol: null, fallbackUrl: null };
    }
    return {
      url: 'msteams://teams.microsoft.com/l/search/0/' + subj,
      protocol: 'msteams:',
      fallbackUrl: 'https://teams.microsoft.com'
    };
  }

  if (src === 'slack') {
    if (m.slackPermalink) return { url: m.slackPermalink, protocol: null, fallbackUrl: null };
    return { url: 'https://app.slack.com/client', protocol: null, fallbackUrl: null };
  }

  if (src === 'jira') {
    return { url: 'https://your-org.atlassian.net', protocol: null, fallbackUrl: null };
  }

  if (src === 'sharepoint') {
    if (m.sourceUrl) return { url: m.sourceUrl, protocol: null, fallbackUrl: null };

function _normSubject(s) {

  return (s || '').replace(/^(Re|RE|Fw|FW|Fwd|FWD|Vs|VS):\s*/g, '')
    .replace(/[—–]/g, '-').trim();
}

function ackFingerprint(m) {

  // Normalize source: treat 'email' and 'outlook' as same canonical value
  var src = (m.source || '').toLowerCase();
  if (src === 'outlook') src = 'email';
  return src + '|' + (m.subject || '') + '|' + (m.from || '');
}

// ── Pull-stable ack signature (THE suppression authority) ──
// Ignores the volatile M365 message id entirely and normalizes the two
// fields that drift between pulls: subject (Re:/FW: prefixes) and sender
// (email vs display name vs empty). Once a signature is acked, any future
// message that reduces to the same signature is suppressed — no re-acking.
function _normSubjectFull(s) {

  var prev;
  do { prev = s; s = s.replace(/^\s*(re|fw|fwd|aw|sv|vs|ed|r)\s*:\s*/i, ''); } while (s !== prev);

}

}

// Reference date = the acked message's own date (msgDate); legacy acks fall back to the ack
// timestamp (at). Indeterminate dates preserve the old suppress behavior (fail safe).
function _ackMatchesDate(entry, m) {

  var md = (m && m.time || '').slice(0, 10);

  return md <= ref;
}

function moveMessageToProject(msgId, targetProject) {
  const m = commsMessages.find(x => x.id === msgId);

function applyMovesToMessages() {

async function rejectMessage(msgId, reason) {
  var m = commsMessages.find(function(x) { return x.id === msgId; });
  if (!m) { showToast('⚠ Message not found'); return; }

  var fp = ackFingerprint(m);
  var project = m.project;
  var fromAddr = m.from || '';
  var subject = m.subject || '';
  var nowIso = new Date().toISOString();

  // 1. Store in rejected messages map
  _rejectedMessages[msgId] = {
    reason: reason,
    at: nowIso,
    fp: fp,
    project: project,
    from: fromAddr,
    subject: subject
  };

  // 2. Remove from commsMessages
  commsMessages = commsMessages.filter(function(x) { return x.id !== msgId; });

  // 3. Persist rejections to DB
  dbSaveRejections();

  // 4. Write a decision record so Scout learns not to re-import
  dbLogDecision({
    project: project,
    type: 'comms-rejection',
    text: 'Rejected comms message: "' + subject + '" from ' + fromAddr + '. Reason: ' + reason,
    source: 'reject-ui',
    at: nowIso,
    rejectedMessage: {
      id: msgId,
      fingerprint: fp,
      from: fromAddr,
      subject: subject,
      source: m.source || ''
    }
  });

  // 5. Strip from summaryRecent — find project and clean summary
  var proj = projects.find(function(p) { return p.id === project; });
  if (proj && proj.summaryRecent) {
    // Try to remove lines that reference the rejected sender/subject
    var lines = proj.summaryRecent.split('\n');
    var senderName = fromAddr.split('@')[0].replace(/[._-]/g, ' ').toLowerCase();
    var subjectLower = subject.toLowerCase();
    var filtered = lines.filter(function(line) {
      var ll = line.toLowerCase();
      // Remove lines that mention the sender name or a significant chunk of the subject
      if (senderName.length > 3 && ll.indexOf(senderName) !== -1) return false;
      // Check for subject keywords (first 3+ words)
      var subjectWords = subjectLower.split(/\s+/).filter(function(w) { return w.length > 3; });
      var matchCount = subjectWords.filter(function(w) { return ll.indexOf(w) !== -1; }).length;
      if (subjectWords.length > 0 && matchCount >= Math.ceil(subjectWords.length * 0.5)) return false;
      return true;
    });
    var newSummary = filtered.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    if (newSummary !== proj.summaryRecent) {
      proj.summaryRecent = newSummary;
      if (_dashboardSummaries[project]) {
        _dashboardSummaries[project].summaryRecent = newSummary;
      }
      console.log('[Reject] summaryRecent cleaned for', project, '— removed lines mentioning:', senderName);
    }
  }

  // 6. Re-render
  renderDetailTabs();
  renderDetailBody();
  renderOverview();

  var projCode = (projects.find(function(p) { return p.id === project; }) || {}).code || project;
  console.log('[Reject]', msgId.slice(0, 30), '| subject:', subject.slice(0, 40), '| project:', projCode, '| reason:', reason.slice(0, 60));
  showToast('✕ Rejected: "' + subject.slice(0, 40) + '" — decision logged');
}

function delivAction(delivId, action) {
  const labels = { delivered:'Mark Delivered', blocked:'Block' };
  const statusMap = { delivered: 'delivered', blocked: 'blocked' };
  const newStatus = statusMap[action] || action;
  // Find and update the deliverable in project data
  var p = projects.find(function(x) { return x.id === currentProject; });
  var found = null;
  if (p) {
    (p.milestones || []).forEach(function(m) {
      (m.deliverables || []).forEach(function(d) {
        if (!found && d.id === delivId) { found = d; }
      });
    });
  }
  if (found) {
    var oldStatus = found.status || 'pending';
    found.status = newStatus;
    found.lastUpdate = TODAY_STR;
    // Persist to config/projects-* (primary source of truth)
    // Do NOT write projects array to state/dashboard — that is Scout's domain
    if (_db && _projectsLoadedFromDb && p) {
      _db.doc('config/projects-' + p.id).update({ milestones: p.milestones }).catch(function(e) {
        console.warn('[delivAction] Config save failed:', e);
        showToast('Deliverable save failed — check connection');
      });
    }
    renderOverview(); if (currentProject) renderDetailBody();
  }
  // DLE: log deliverable status change
  dleLogDecision({
    item_type: 'deliverable_action',
    item_id: delivId,
    project: currentProject || 'unknown',
    signals: { action: action },
    rank_shown: null,
    action: action,
  });
  showToast(`${labels[action] || action}: ${delivId}${found ? ' — ' + (found.status === newStatus ? 'saved' : 'logged') : ' — logged to DLE'}`);
}

function verifyAction(delivId) {
  const finding = (_verifState.findings || []).find(f => f.deliverableId === delivId);
  if (!finding) {
    showToast(`${delivId} — not yet audited by AGT-004. Will be checked in next verification pass.`);
    return;
  }
  const statusMap = { verified: '✅ VERIFIED', unverified: '❌ UNVERIFIED', partially_verified: '⚠️ PARTIAL', source_unavailable: '🔍 SOURCE N/A' };
  const label = statusMap[finding.status] || finding.status;
  const sources = (finding.sourcesChecked || []).join(', ') || 'none';
  const ts = finding.checkedAt ? new Date(finding.checkedAt).toLocaleString('en-GB', {timeZone:TIMEZONE, day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'unknown';
  showToast(`${delivId} — ${label} | Sources: ${sources} | Checked: ${ts}${finding.notes ? ' | ' + finding.notes : ''}`);
}

function showStatusDropdown(anchorEl, projectId) {
  closeStatusDropdown();
  const p = projects.find(x => x.id === projectId);
  if (!p) return;
  const statuses = ['on_track', 'at_risk', 'blocked', 'delivered', 'stalled'];
  const colors = { on_track: 'var(--status-on-track)', at_risk: 'var(--status-at-risk)', blocked: 'var(--status-blocked)', delivered: 'var(--status-delivered)', stalled: 'var(--status-stalled)' };
  const dd = document.createElement('div');
  dd.className = 'status-dropdown';
  dd.id = 'statusDropdown';
  dd.innerHTML = statuses.map(s =>
    `<button data-status="${s}"><span class="dot" style="background:${colors[s]}"></span>${statusLabel(s)}${s === p.status ? ' ✓' : ''}</button>`
  ).join('');
  // Position below the anchor
  const rect = anchorEl.getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.left = rect.left + 'px';
  document.body.appendChild(dd);
  dd.addEventListener('click', function(e) {
    const btn = e.target.closest('[data-status]');
    if (!btn) return;
    const newStatus = btn.dataset.status;
    if (newStatus !== p.status) {
      const old = p.status;
      p.status = newStatus;
      saveProjectField(p.id, { status: newStatus });
      dleLogDecision({ action_type: 'status_change', item_type: 'project_status', project: p.id, detail: old + ' → ' + newStatus });
      // Update header
      document.getElementById('dpStatus').innerHTML = `${dbIndicatorHtml(p.id)} <span class="status-chip status-${p.status}" style="cursor:pointer" data-edit-status="${p.id}"><span class="dot"></span>${statusLabel(p.status)}</span>`;
      renderOverview();
      showToast(p.name + ': ' + statusLabel(old) + ' → ' + statusLabel(newStatus));
    }
    closeStatusDropdown();
  });
  // Close on outside click
  setTimeout(() => document.addEventListener('click', _statusDropdownClose, true), 0);
}
function _statusDropdownClose(e) {
  const dd = document.getElementById('statusDropdown');
  if (dd && !dd.contains(e.target)) closeStatusDropdown();
}
function closeStatusDropdown() {
  const dd = document.getElementById('statusDropdown');
  if (dd) dd.remove();
  document.removeEventListener('click', _statusDropdownClose, true);
}

function inlineEditText(el, currentValue, onSave, multiline) {
  if (el.querySelector('.edit-input, .edit-textarea')) return; // already editing
  const orig = el.innerHTML;
  if (multiline) {
    el.innerHTML = `<textarea class="edit-textarea">${(currentValue || '').replace(/</g,'&lt;')}</textarea>`;
  } else {
    el.innerHTML = `<input class="edit-input" value="${(currentValue || '').replace(/"/g,'&quot;')}">`;
  }
  const input = el.querySelector('.edit-input, .edit-textarea');
  input.focus();
  input.select && input.select();

  function commit() {
    const val = input.value.trim();
    if (val !== (currentValue || '').trim()) {
      onSave(val);
    } else {
      el.innerHTML = orig;
    }
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !multiline) { e.preventDefault(); input.blur(); }
    if (e.key === 'Enter' && e.ctrlKey && multiline) { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { el.innerHTML = orig; }
  });
}

function inlineEditSelect(el, currentValue, options, onSave) {
  if (el.querySelector('select')) return;
  const orig = el.innerHTML;
  const optHtml = options.map(o => `<option value="${o.value}"${o.value === currentValue ? ' selected' : ''}>${o.label}</option>`).join('');
  el.innerHTML = `<select class="edit-input" style="width:auto">${optHtml}</select>`;
  const sel = el.querySelector('select');
  sel.focus();
  function commit() {
    if (sel.value !== currentValue) {
      onSave(sel.value);
    } else {
      el.innerHTML = orig;
    }
  }
  sel.addEventListener('blur', commit);
  sel.addEventListener('change', function() { sel.blur(); });
  sel.addEventListener('keydown', function(e) { if (e.key === 'Escape') el.innerHTML = orig; });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeStatusDropdown();
    if (document.getElementById('verifLogOverlay').classList.contains('open')) { closeVerifLog(); return; }
    closeDetail();
  }
});

// Session detection: morning (before 11), lunch (11-14), evening (after 17), ad-hoc otherwise
function dleDetectSession() {
  const h = new Date().getHours();
  if (h < 11) return 'morning';
  if (h < 14) return 'lunch';
  if (h >= 17) return 'evening';
  return 'ad-hoc';
}

// Core DLE state — in-memory (prototype); target: state/decision-log.jsonl
const dleState = {
  decisionLog: [],        // all logged decisions this session
  sessionStart: Date.now(),
  sessionType: dleDetectSession(),
  // Learned weights for attention ranking (initialised to equal weight)
  weights: { partner_quiet_days: 1.0, milestone_proximity_days: 1.0, unread_comms: 1.0, status_severity: 1.0, days_since_update: 1.0, deliverable_count: 1.0 },
  // Project-level attention distribution (from Scout task, sums to ~1.0)
  projectWeights: {},
  // Drift keys the user confirmed (Keep) — suppresses re-generation until weight changes significantly
  confirmedDrifts: {},  // { projectId: { weight: N, ts: ISO } }
  // Historical weekly snapshots (prototype seed)
  weeklyHistory: [
    { week: '2026-W37', feedbackVolume: 12, rankAccuracy: 0.58, avgTimeToAction: 3400, overrideRate: 0.25 },
    { week: '2026-W38', feedbackVolume: 18, rankAccuracy: 0.63, avgTimeToAction: 2900, overrideRate: 0.19 },
  ],
  // Milestone delivery log
  milestoneDeliveries: [],
  // Persisted total decision count (survives page reload)
  _persistedDecisionCount: 0,
  // Persisted decisions loaded from DB — keyed by project for activity feed
  _persistedDecisions: [], // [{project, type, text, at, source, ...}]
  // DLE panel open state
  panelOpen: false,
  // Currently expanded tile detail (null, 'volume', 'accuracy', 'override')
  _expandedTile: null,
};

// Attention item render timestamp (for time-to-action measurement)
let attentionRenderTs = null;

// ── Decision log capture ──
// Safety: decision category classification
// Cat 1: read/observe (no side effects) — attention clicks, dismissals
// Cat 2: local state change (reversible) — milestone delivery, weight adjustment
// Cat 3: external effect (sends, writes to systems of record) — comms send, push to GitLab
function dleSafetyCategory(entry) {
  const type = entry.item_type || entry.action_type || '';
  if (['attention','dismiss','partner_click','project_assignment'].includes(type)) return 1;
  if (['milestone_delivered','drift_confirm','drift_reset','weight_update','comms_ack'].includes(type)) return 2;
  if (['comms_send','external_push','deliverable_push'].includes(type)) return 3;
  return 1; // default to safest
}

function dleLogDecision(entry) {
  const safetyCategory = dleSafetyCategory(entry);
  const row = {
    ts: new Date().toISOString(),
    session: dleState.sessionType,
    safetyCategory,
    ...entry,
    time_to_action_ms: entry.time_to_action_ms || (attentionRenderTs ? Date.now() - attentionRenderTs : null),
  };
  dleState.decisionLog.push(row);
  dleState._persistedDecisionCount = Math.max(dleState._persistedDecisionCount, dleState._persistedDecisionCount + 1);
  // Persist to artifact db (fire-and-forget)
  dbLogDecision(row);
  // Console trace for development
  console.log('[DLE] Decision logged:', JSON.stringify(row));
  // Update DLE health panel if visible
  const dleBody = document.querySelector('.dle-body');
  if (dleBody && dleBody.classList.contains('open')) {
    dleBody.innerHTML = renderDLEHealthContent();
  }
}

function togglePartnerLog(partnerName, project) {
  // Find the clicked row
  var rows = document.querySelectorAll('[data-partner-name]');
  var targetRow = null;
  rows.forEach(function(r) {
    if (r.dataset.partnerName === partnerName && r.dataset.partnerId === project) targetRow = r;
  });
  if (!targetRow) return;

  // Toggle: if log already open for this partner, close it
  var existing = targetRow.nextElementSibling;
  if (existing && existing.classList.contains('partner-log')) {
    existing.remove();
    return;
  }
  // Close any other open log
  document.querySelectorAll('.partner-log').forEach(function(el) { el.remove(); });

  // Resolve each message's sender to a partner display name using the SAME rules as the pulse,
  // then show THIS partner's recent messages in THIS project. (_dbPartnerData contact lists are
  // not maintained, so match by sender domain — exactly how the pulse computes the partner.)
  var _pr = _partnerRules || {};
  var _dMap = _pr.domainMap || {};
  var _mMap = _pr.mergeMap || {};
  var _nMap = {
    'partner-a': 'Partner A', 'partner-b': 'Partner B', 'partner-c': 'Partner C',
    customer: 'Customer Org', yourorg: 'Your Org'
  };
  var _pIdMap = { 'ALPHA':'p1', 'BETA':'p2', 'GAMMA':'p3' };
  function _domOf(email) { if (!email || typeof email !== 'string') return ''; var at = email.lastIndexOf('@'); return at > 0 ? email.slice(at + 1).toLowerCase() : ''; }
  function _slugOf(dom) { var s = _dMap[dom]; if (s) return _mMap[s] || s; var b = dom.split('.')[0].toLowerCase(); return _mMap[b] || b; }
  function _nameOf(s) { return _nMap[s] || s.split('-').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' '); }
  var matches = (commsMessages || []).filter(function(m) {
    if (!m.from) return false;
    var mpid = m.project ? (_pIdMap[m.project] || String(m.project).toLowerCase()) : null;
    if (project && mpid && mpid !== project) return false;
    return _nameOf(_slugOf(_domOf(m.from))) === partnerName;
  });
  // Sort by time descending, take top 5
  matches.sort(function(a, b) { return (b.time || b.date || '').localeCompare(a.time || a.date || ''); });
  matches = matches.slice(0, 5);

  // Build log HTML
  var logDiv = document.createElement('div');
  logDiv.className = 'partner-log';
  if (!matches.length) {
    // No message in the current (50-capped) feed — fall back to the durable last-contact so the
    // row always tells the user something, even when the last message predates the feed window.
    var _durMsg = '';
    var _dpa = (_dbPartnerActivity && _dbPartnerActivity.byProject && _dbPartnerActivity.byProject[project]) || {};
    Object.keys(_dpa).forEach(function(s) {
      var e = _dpa[s] || {};
      var nm = e.name || _nameOf(s);
      if (nm === partnerName && e.lastSeen) {
        _durMsg = 'Last contact ' + String(e.lastSeen).slice(0, 10) + (e.subject ? ' · ' + e.subject : '') + ' — older than the current message window.';
      }
    });
    logDiv.innerHTML = '<div class="partner-log-empty">' + (_durMsg ? _escHtml(_durMsg) : ('No recent messages from ' + _escHtml(partnerName) + ' in the current feed.')) + '</div>';
  } else {
    var channelIcons = { email: '✉', slack: '#', teams: '◆', sharepoint: '📂' };
    logDiv.innerHTML = matches.map(function(m) {
      var dt = (m.time || m.date || '').slice(0, 10);
      var ch = channelIcons[m.source || m.channel] || '·';
      var proj = m.project ? m.project : '';
      var subj = m.subject || m.body || '(no subject)';
      if (subj.length > 80) subj = subj.slice(0, 77) + '…';
      return '<div class="partner-log-item">' +
        '<span class="partner-log-date">' + dt + '</span>' +
        '<span class="partner-log-channel">' + ch + '</span>' +
        (proj ? '<span class="partner-log-proj">' + _escHtml(proj) + '</span>' : '') +
        '<span class="partner-log-subj">' + _escHtml(subj) + '</span>' +
      '</div>';
    }).join('');
  }
  targetRow.after(logDiv);
}

// ── Scoring: rank attention items by learned weights ──
function dleScoreAttentionItem(signals) {
  const w = dleState.weights;
  let score = 0;
  if (signals.partner_quiet_days) score += (signals.partner_quiet_days / 30) * w.partner_quiet_days;
  if (signals.milestone_proximity_days != null) score += Math.max(0, (60 - signals.milestone_proximity_days) / 60) * w.milestone_proximity_days;
  if (signals.unread_comms) score += (signals.unread_comms / 10) * w.unread_comms;
  if (signals.status === 'stalled') score += 1.0 * w.status_severity;
  else if (signals.status === 'blocked') score += 0.8 * w.status_severity;
  else if (signals.status === 'at_risk') score += 0.6 * w.status_severity;
  if (signals.days_since_update) score += (signals.days_since_update / 30) * w.days_since_update;
  return score;
}

// ── DLE Health metrics calculation ──
function dleCalculateMetrics() {
  const log = dleState.decisionLog;
  const attentionLog = log.filter(r => r.item_type === 'attention');

  // 1. Feedback volume (total decisions this session)
  const feedbackVolume = log.length;

  // 2. Rank accuracy: % of clicks that went to #1 or #2 ranked items
  const clicks = attentionLog.filter(r => r.action === 'clicked');
  const topClicks = clicks.filter(r => r.rank_shown <= 2).length;
  const rankAccuracy = clicks.length > 0 ? topClicks / clicks.length : null;

  // 3. Time-to-action: average ms from render to first action (7-day rolling — in prototype, session average)
  const withTime = log.filter(r => r.time_to_action_ms && r.time_to_action_ms > 0);
  const avgTimeToAction = withTime.length > 0
    ? Math.round(withTime.reduce((s, r) => s + r.time_to_action_ms, 0) / withTime.length)
    : null;

  // 4. Override rate: % of dismissed items that had rank <= 2 (user disagrees with top ranking)
  const dismissed = attentionLog.filter(r => r.action === 'dismissed');
  const overrides = dismissed.filter(r => r.rank_shown <= 2).length;
  const overrideRate = dismissed.length > 0 ? overrides / dismissed.length : null;

  return { feedbackVolume, rankAccuracy, avgTimeToAction, overrideRate };
}

// ── DLE weekly snapshot (auto-run check) ──
function dleWeeklySnapshot() {
  const now = new Date();
  const weekNum = getISOWeek(now);
  const weekStr = now.getFullYear() + '-W' + String(weekNum).padStart(2, '0');

  // Already have a snapshot for this week?
  if (dleState.weeklyHistory.find(h => h.week === weekStr)) return null;

  const metrics = dleCalculateMetrics();
  if (metrics.feedbackVolume === 0) return null; // nothing to snapshot

  const snapshot = {
    week: weekStr,
    feedbackVolume: metrics.feedbackVolume,
    rankAccuracy: metrics.rankAccuracy !== null ? Math.round(metrics.rankAccuracy * 100) / 100 : null,
    avgTimeToAction: metrics.avgTimeToAction,
    overrideRate: metrics.overrideRate !== null ? Math.round(metrics.overrideRate * 100) / 100 : null,
  };
  dleState.weeklyHistory.push(snapshot);
  console.log('[DLE] Weekly snapshot:', JSON.stringify(snapshot));
  return snapshot;
}

function getISOWeek(d) {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

// ── Render DLE Health panel content ──
function renderDLEHealthContent() {
  const m = dleCalculateMetrics();
  const hist = dleState.weeklyHistory;

  function sparkline(values, highlight) {
    if (!values || values.length === 0) return '';
    const max = Math.max(...values, 1);
    return '<div class="dle-sparkline">' + values.map((v, i) => {
      const h = Math.max(2, (v / max) * 24);
      const cls = i === values.length - 1 ? ' latest' : '';
      return `<div class="bar${cls}" style="height:${h}px" title="${v}"></div>`;
    }).join('') + '</div>';
  }

  function trend(current, history, key) {
    if (history.length < 2) return '<span class="dle-metric-trend flat">—</span>';
    const prev = history[history.length - 1][key];
    if (prev == null || current == null) return '<span class="dle-metric-trend flat">—</span>';
    const delta = current - prev;
    if (Math.abs(delta) < 0.01) return '<span class="dle-metric-trend flat">→ stable</span>';
    // For time-to-action, lower is better; for others, higher is better
    const isGood = key === 'avgTimeToAction' ? delta < 0 : delta > 0;
    const arrow = delta > 0 ? '↑' : '↓';
    return `<span class="dle-metric-trend ${isGood ? 'up' : 'down'}">${arrow} vs last week</span>`;
  }

  const volumeHist = hist.map(h => h.feedbackVolume);
  const accuracyHist = hist.map(h => Math.round((h.rankAccuracy || 0) * 100));
  const timeHist = hist.map(h => h.avgTimeToAction || 0);
  const overrideHist = hist.map(h => Math.round((h.overrideRate || 0) * 100));

  // Currently expanded tile (persisted in dleState)
  const expanded = dleState._expandedTile || null;

  let html = '<div class="dle-metrics">';

  // Feedback Volume
  html += `<div class="dle-metric expandable${expanded === 'volume' ? ' expanded' : ''}" data-dle-tile="volume">
    <div class="dle-metric-value">${m.feedbackVolume}</div>
    <div class="dle-metric-label">Feedback Volume</div>
    ${trend(m.feedbackVolume, hist, 'feedbackVolume')}
    ${sparkline([...volumeHist, m.feedbackVolume])}
  </div>`;

  // Rank Accuracy
  const accDisplay = m.rankAccuracy !== null ? Math.round(m.rankAccuracy * 100) + '%' : '—';
  html += `<div class="dle-metric expandable${expanded === 'accuracy' ? ' expanded' : ''}" data-dle-tile="accuracy">
    <div class="dle-metric-value">${accDisplay}</div>
    <div class="dle-metric-label">Rank Accuracy</div>
    ${trend(m.rankAccuracy, hist, 'rankAccuracy')}
    ${sparkline([...accuracyHist, m.rankAccuracy !== null ? Math.round(m.rankAccuracy * 100) : 0])}
  </div>`;

  // Insert detail panel after the tile pair if one of these two is expanded
  if (expanded === 'volume') html += renderDLETileDetail('volume', m);
  if (expanded === 'accuracy') html += renderDLETileDetail('accuracy', m);

  // Time-to-Action (not expandable)
  const ttaDisplay = m.avgTimeToAction !== null ? (m.avgTimeToAction / 1000).toFixed(1) + 's' : '—';
  html += `<div class="dle-metric">
    <div class="dle-metric-value">${ttaDisplay}</div>
    <div class="dle-metric-label">Avg Time-to-Action</div>
    ${trend(m.avgTimeToAction, hist, 'avgTimeToAction')}
    ${sparkline([...timeHist, m.avgTimeToAction || 0])}
  </div>`;

  // Override Rate
  const orDisplay = m.overrideRate !== null ? Math.round(m.overrideRate * 100) + '%' : '—';
  html += `<div class="dle-metric expandable${expanded === 'override' ? ' expanded' : ''}" data-dle-tile="override">
    <div class="dle-metric-value">${orDisplay}</div>
    <div class="dle-metric-label">Override Rate</div>
    ${trend(m.overrideRate, hist, 'overrideRate')}
    ${sparkline([...overrideHist, m.overrideRate !== null ? Math.round(m.overrideRate * 100) : 0])}
  </div>`;

  // Insert detail panel after the second tile pair if override is expanded
  if (expanded === 'override') html += renderDLETileDetail('override', m);

  html += '</div>';

  // Learning note — use persisted count + session count (deduplicated: session decisions are also persisted)
  const totalDecisions = Math.max(dleState._persistedDecisionCount, dleState.decisionLog.length);
  const threshold = 30;
  if (totalDecisions < threshold) {
    html += `<div class="dle-learning-note">
      <strong>Learning phase:</strong> ${totalDecisions}/${threshold} decisions captured. After ${threshold} interactions, DLE will start adjusting attention ranking weights based on your patterns.
    </div>`;
  } else {
    html += `<div class="dle-learning-note">
      <strong>Active learning:</strong> ${totalDecisions} decisions captured. Weights are being tuned — check override rate to see if ranking matches your priorities.
    </div>`;
  }

  return html;
}

// ── DLE tile detail panel renderer ──
function renderDLETileDetail(tile, metrics) {
  const log = dleState.decisionLog;
  const hist = dleState.weeklyHistory;
  // 14-day retention window for individual decisions
  const cutoff = new Date(Date.now() - 14 * 86400000).toISOString();
  const recent = log.filter(r => r.ts >= cutoff);

  let html = '<div class="dle-tile-detail">';

  if (tile === 'volume') {
    html += '<h4>Feedback Breakdown <span style="font-weight:400;color:var(--ink-muted);font-size:10px">(last 14 days)</span></h4>';
    // By type
    const byType = {};
    recent.forEach(r => {
      const t = r.item_type || 'other';
      byType[t] = (byType[t] || 0) + 1;
    });
    const typeLabels = { attention: '🎯 Attention clicks', comms: '✉️ Comms acks', milestone_delivery: '🏁 Milestone deliveries', partner_pulse: '👥 Partner clicks', drift_confirm: '⚖️ Drift confirms', drift_reset: '↩️ Drift resets', comms_ack: '✉️ Comms acks' };
    html += '<div class="dle-detail-chips">';
    Object.keys(byType).sort((a,b) => byType[b] - byType[a]).forEach(t => {
      html += `<span class="dle-detail-chip"><span class="num">${byType[t]}</span><span class="lbl">${typeLabels[t] || t}</span></span>`;
    });
    if (Object.keys(byType).length === 0) html += '<span class="dle-detail-empty">No decisions in the last 14 days</span>';
    html += '</div>';
    // By project
    const byProj = {};
    recent.forEach(r => { if (r.project) byProj[r.project] = (byProj[r.project] || 0) + 1; });
    if (Object.keys(byProj).length > 0) {
      html += '<div class="dle-detail-sub"><strong>By project:</strong> ';
      html += Object.keys(byProj).sort((a,b) => byProj[b] - byProj[a])
        .map(p => `${_escHtml(p)} (${byProj[p]})`).join(' · ');
      html += '</div>';
    }
    // Weekly trend table
    if (hist.length > 0) {
      html += '<div class="dle-detail-sub"><strong>Weekly trend:</strong></div>';
      html += '<table class="dle-detail-table"><tr><th>Week</th><th>Volume</th></tr>';
      hist.slice(-6).forEach(h => {
        html += `<tr><td>${h.week}</td><td style="font-weight:600">${h.feedbackVolume}</td></tr>`;
      });
      html += '</table>';
    }
  }

  else if (tile === 'accuracy') {
    html += '<h4>Rank Accuracy Detail <span style="font-weight:400;color:var(--ink-muted);font-size:10px">(last 14 days)</span></h4>';
    const attClicks = recent.filter(r => r.item_type === 'attention' && r.action === 'clicked');
    const top2 = attClicks.filter(r => r.rank_shown <= 2).length;
    const lower = attClicks.filter(r => r.rank_shown > 2).length;
    html += '<div class="dle-detail-chips">';
    html += `<span class="dle-detail-chip"><span class="num">${attClicks.length}</span><span class="lbl">total clicks</span></span>`;
    html += `<span class="dle-detail-chip"><span class="num">${top2}</span><span class="lbl">on top-2 items</span></span>`;
    html += `<span class="dle-detail-chip"><span class="num">${lower}</span><span class="lbl">on lower-ranked</span></span>`;
    html += '</div>';
    // Which lower-ranked items were clicked (user went past top suggestions)
    const lowerItems = attClicks.filter(r => r.rank_shown > 2);
    if (lowerItems.length > 0) {
      html += '<div class="dle-detail-sub"><strong>Clicked past top-2:</strong></div>';
      html += '<table class="dle-detail-table"><tr><th>Item</th><th>Project</th><th>Rank</th></tr>';
      lowerItems.slice(-8).forEach(r => {
        html += `<tr><td>${_escHtml(r.item_id || '—')}</td><td>${_escHtml(r.project || '—')}</td><td style="font-weight:600">#${r.rank_shown}</td></tr>`;
      });
      html += '</table>';
    } else if (attClicks.length === 0) {
      html += '<div class="dle-detail-empty">No attention clicks recorded yet — click items in the attention bar to start tracking</div>';
    }
    // Weekly trend
    if (hist.length > 0) {
      html += '<div class="dle-detail-sub"><strong>Weekly trend:</strong></div>';
      html += '<table class="dle-detail-table"><tr><th>Week</th><th>Accuracy</th></tr>';
      hist.slice(-6).forEach(h => {
        const acc = h.rankAccuracy != null ? Math.round(h.rankAccuracy * 100) + '%' : '—';
        html += `<tr><td>${h.week}</td><td style="font-weight:600">${acc}</td></tr>`;
      });
      html += '</table>';
    }
  }

  else if (tile === 'override') {
    html += '<h4>Human Override Detail <span style="font-weight:400;color:var(--ink-muted);font-size:10px">(last 14 days)</span></h4>';
    const dismissed = recent.filter(r => r.item_type === 'attention' && r.action === 'dismissed');
    const overrides = dismissed.filter(r => r.rank_shown <= 2);
    const nonOverrides = dismissed.filter(r => r.rank_shown > 2);
    html += '<div class="dle-detail-chips">';
    html += `<span class="dle-detail-chip"><span class="num">${dismissed.length}</span><span class="lbl">total dismissals</span></span>`;
    html += `<span class="dle-detail-chip"><span class="num">${overrides.length}</span><span class="lbl">overrides (top-2)</span></span>`;
    html += `<span class="dle-detail-chip"><span class="num">${nonOverrides.length}</span><span class="lbl">lower-rank dismissals</span></span>`;
    html += '</div>';
    // Which signals drove overridden items
    if (overrides.length > 0) {
      html += '<div class="dle-detail-sub"><strong>Overridden items:</strong></div>';
      html += '<table class="dle-detail-table"><tr><th>Item</th><th>Project</th><th>Rank</th><th>Top signal</th></tr>';
      overrides.slice(-8).forEach(r => {
        let topSignal = '—';
        if (r.signals && typeof r.signals === 'object') {
          const sigKeys = Object.keys(r.signals).filter(k => typeof r.signals[k] === 'number');
          if (sigKeys.length > 0) {
            sigKeys.sort((a,b) => r.signals[b] - r.signals[a]);
            topSignal = sigKeys[0].replace(/_/g, ' ');
          }
        }
        html += `<tr><td>${_escHtml(r.item_id || '—')}</td><td>${_escHtml(r.project || '—')}</td><td style="font-weight:600">#${r.rank_shown}</td><td>${_escHtml(topSignal)}</td></tr>`;
      });
      html += '</table>';
    } else if (dismissed.length === 0) {
      html += '<div class="dle-detail-empty">No dismissals yet — use the ✕ on attention items to tell the system what\'s not relevant</div>';
    }
    // Weekly trend
    if (hist.length > 0) {
      html += '<div class="dle-detail-sub"><strong>Weekly trend:</strong></div>';
      html += '<table class="dle-detail-table"><tr><th>Week</th><th>Override rate</th></tr>';
      hist.slice(-6).forEach(h => {
        const or = h.overrideRate != null ? Math.round(h.overrideRate * 100) + '%' : '—';
        html += `<tr><td>${h.week}</td><td style="font-weight:600">${or}</td></tr>`;
      });
      html += '</table>';
    }
  }

  html += '</div>';
  return html;
}
