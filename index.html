// ── Freshness calculation ──
function obsFreshnessAge(isoStr) {
  if (!isoStr) return { hours: Infinity, label: 'Syncing…', cls: 'stale' };
  const ageMs = Date.now() - new Date(isoStr).getTime();
  const hours = ageMs / 3600000;
  if (hours < 1) return { hours, label: Math.round(hours * 60) + 'm ago', cls: 'fresh' };
  if (hours < 24) return { hours, label: Math.round(hours) + 'h ago', cls: 'fresh' };
  if (hours < 48) return { hours, label: Math.round(hours) + 'h ago', cls: 'stale' };
  return { hours, label: Math.round(hours / 24) + 'd ago', cls: 'very-stale' };
}

// Compute overall freshness: worst of all sources
function obsOverallFreshness() {
  let worst = { hours: 0, label: 'Just now', cls: 'fresh' };
  Object.values(obsState.sources).forEach(s => {
    const f = obsFreshnessAge(s.lastPull);
    if (f.hours > worst.hours) worst = f;
  });
  return worst;
}

// ── Sync warning banner ──
let _syncWarningDismissed = false;
let _lastSyncState = {};

function updateSyncWarningBanner() {
  const banner = document.getElementById('syncWarningBanner');
  if (!banner || _syncWarningDismissed) { if (banner) banner.classList.remove('visible'); return; }

  const d = _lastSyncState;
  if (!d || !d._heartbeat) { banner.classList.remove('visible'); return; }

  const icon = document.getElementById('swbIcon');
  const text = document.getElementById('swbText');
  let level = null, msg = '';

  // 1. Check for error status
  if (d._runStatus === 'error') {
    level = 'error';
    const errMsg = d._runError || 'Unknown error';
    const errTime = d._runErrorAt ? new Date(d._runErrorAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TIMEZONE }) : '';
    msg = 'Scout run failed' + (errTime ? ' at ' + errTime + ' EEST' : '') + ': ' + errMsg;
  }
  // 2. Check for stuck run (running > 30 min)
  else if (d._runStatus === 'running' && d._heartbeat) {
    const runningMs = Date.now() - new Date(d._heartbeat).getTime();
    if (runningMs > 30 * 60 * 1000) {
      level = 'warn';
      msg = 'Scout run appears stuck — started ' + Math.round(runningMs / 60000) + ' minutes ago and hasn’t completed.';
    }
  }

  // 3. Check for stale heartbeat (> 6 hours since last completed run)
  if (!level) {
    const heartbeatAge = Date.now() - new Date(d._heartbeat).getTime();
    const sixHours = 6 * 3600 * 1000;
    if (d._runStatus === 'completed' && heartbeatAge > sixHours) {
      level = 'stale';
      const hoursAgo = Math.round(heartbeatAge / 3600000);
      msg = 'Last successful sync was ' + hoursAgo + ' hours ago. Next scheduled runs: 09:00, 13:00, 16:00 EEST.';
    } else if (!d._runStatus && d.lastTaskRun) {
      // Legacy: no heartbeat status yet, check lastTaskRun staleness
      const lastRunAge = Date.now() - new Date(d.lastTaskRun).getTime();
      if (lastRunAge > sixHours) {
        level = 'stale';
        const hoursAgo = Math.round(lastRunAge / 3600000);
        msg = 'Last sync was ' + hoursAgo + ' hours ago. Data may be outdated.';
      }
    }
  }

  if (level) {
    banner.className = 'sync-warning-banner visible level-' + level;
    if (icon) icon.textContent = level === 'error' ? '✕' : '⚠';
    if (text) text.textContent = msg;
  } else {
    banner.classList.remove('visible');
  }
}

// Manual pull — re-reads DB state; for a full source pull, fire the Scout scheduled task
function triggerManualPull() {
  if (!_db) { showToast('DB not connected — cannot refresh'); return; }
  showToast('Refreshing from DB...');
  _db.doc('state/dashboard').get().then(function(snap) {
    if (snap.exists) {
      var d = _deepClone(snap.data());
      // Merge fresh overlay data into in-memory projects (same normalization as onSnapshot)
      if (d.projects && d.projects.length) {
        var idMap = { 'ALPHA':'p1', 'BETA':'p2', 'GAMMA':'p3' };
        d.projects.forEach(function(dp) {
          var pid = idMap[dp.id] || dp.id.toLowerCase();
          var local = projects.find(function(p) { return p.id === pid; });
          if (!local) return;
          // Overlay Scout fields only (same as onSnapshot handler)
          if (dp.status) local.status = _normalizeStatus(dp.status);
          if (dp.recentActivity) local.recentActivity = dp.recentActivity; // accept both array and string
          if (dp.notes) local.notes = dp.notes;
          if (dp.summaryBaseline) local.summaryBaseline = dp.summaryBaseline;
          if (dp.summaryRecent !== undefined) local.summaryRecent = dp.summaryRecent;
          if (dp.weeklyLog) local.weeklyLog = dp.weeklyLog;
          if (dp.baselineProposal !== undefined) local.baselineProposal = dp.baselineProposal;
          // Update clobber-proof cache
          var ds = _dashboardSummaries[pid] || {};
          if (dp.summaryBaseline) ds.summaryBaseline = dp.summaryBaseline;
          if (dp.summaryRecent !== undefined) ds.summaryRecent = dp.summaryRecent;
          if (dp.weeklyLog) ds.weeklyLog = dp.weeklyLog;
          if (dp.baselineProposal !== undefined) ds.baselineProposal = dp.baselineProposal;
          if (dp.notes) ds.notes = dp.notes;
          if (dp.status) ds.status = _normalizeStatus(dp.status);
          if (dp.recentActivity) ds.recentActivity = dp.recentActivity; // accept both array and string
          _dashboardSummaries[pid] = ds;
        });
      }
      // comms + calendar now come from state/pull-latest (not the dashboard doc)
      _db.doc('state/pull-latest').get().then(function(ps) {
        if (ps.exists) { var pd = ps.data(); if (pd._pullComplete !== false) { _ingestComms(pd.commsMessages); _ingestCalendar(pd.calendarEvents); } }
        rebuildPartnerPulse(); renderOverview(); if (currentProject) { renderDetailTabs(); renderDetailBody(); }
      }).catch(function(e) { console.warn('[Pull] manual pull-latest get failed:', e && e.code); rebuildPartnerPulse(); });
      if (d._lastSync) {
        obsState.lastRun.ts = d._lastSync;
        obsState.lastRun.status = 'ok';
        // Backfill any sources still at null
        Object.values(obsState.sources).forEach(function(s) {
          if (!s.lastPull) s.lastPull = d._lastSync;
        });
      }
      if (d._syncSources && d._syncSources.obsidian) {
        obsState.lastRun.ts = d._lastSync;
        obsState.lastRun.status = 'ok';
        obsUpdateSyncPill();
        obsUpdateAllBadges();
        if (obsState.traceOpen) obsRenderRunTrace();
      }
      // Always update badges after loading dashboard state with _lastSync
      if (d._lastSync) { obsUpdateSyncPill(); obsUpdateAllBadges(); }
      renderOverview();
      if (currentProject) { renderDetailTabs(); renderDetailBody(); }
      updateDataSourceBadges();
      var msgCount = (d.commsMessages || []).length;
      showToast('DB refresh complete — ' + msgCount + ' messages, ' + (d.projects || []).length + ' projects loaded');
    } else {
      showToast('No dashboard state in DB');
    }
  }).catch(function(err) {
    console.warn('[Pull] DB read error:', err);
    showToast('Refresh failed — check console');
  });
}

// ── Drift detection (project-level weights from Scout) ──
var _expiredDriftConfirms = []; // filled by obsDriftCheck, flushed after render
var _renderCount = 0;
function obsDriftCheck() {
  _expiredDriftConfirms = [];
  const driftItems = [];
  const pw = dleState.projectWeights;
  const keys = Object.keys(pw);
  console.log('[DRIFT-CHECK] projectWeights:', JSON.stringify(pw));
  console.log('[DRIFT-CHECK] confirmedDrifts:', JSON.stringify(dleState.confirmedDrifts));
  if (keys.length === 0) return driftItems;

  // Active-only baseline: exclude projects with 0% activity
  const activeKeys = keys.filter(function(k) { return pw[k] > 0; });
  const activeCount = Math.max(activeKeys.length, 1);
  const avgShare = 1.0 / activeCount;
  const DRIFT_THRESHOLD = 0.8; // 80% deviation from active average

  keys.forEach(function(key) {
    const val = pw[key];
    if (val == null || val === 0) return; // skip dormant projects
    // Skip if user already confirmed this drift (unless weight changed >15% since confirmation)
    var conf = dleState.confirmedDrifts[key];
    if (conf) {
      var weightShift = Math.abs(val - conf.weight) / Math.max(conf.weight, 0.01);
      console.log('[DRIFT-CHECK]', key, ': val=', val, 'conf.weight=', conf.weight, 'shift=', weightShift.toFixed(3));
      if (weightShift < 0.15) return; // still within confirmed range
      // Weight shifted significantly since confirmation — mark for clearing (no side effect during render)
      _expiredDriftConfirms.push(key);
    }
    const change = (val - avgShare) / avgShare;
    if (Math.abs(change) >= DRIFT_THRESHOLD) {
      const proj = projects.find(function(p) { return p.id === key; });
      const friendlyName = proj ? proj.name : key;
      const valPct = Math.round(val * 100);
      const avgPct = Math.round(avgShare * 100);
      const ratio = (val / avgShare).toFixed(1);
      var text;
      if (change > 0) {
        text = `${friendlyName}: ${valPct}% of attention (${ratio}× the ${avgPct}% avg across ${activeCount} active projects) — keep focus or rebalance?`;
      } else {
        text = `${friendlyName}: only ${valPct}% of attention (avg is ${avgPct}% across ${activeCount} active projects) — needs more focus?`;
      }
      driftItems.push({
        tag: 'Drift',
        tagClass: 'att-drift',
        text: text,
        project: 'system',
        itemId: 'drift-' + key,
        signals: { drift_key: key, drift_pct: Math.round(Math.abs(change) * 100), current_value: val, avg_share: avgShare, active_count: activeCount },
        isDrift: true,
        driftKey: key,
        driftBaseValue: avgShare,
      });
    }
  });
  return driftItems;
}

// Resource-risk detection: flag months with ≥3 cross-project milestones within a 21-day window
function obsClusterCheck() {
  var clusterItems = [];
  var now = new Date();
  // Collect all future milestones across projects (within next 120 days)
  var upcoming = [];
  projects.forEach(function(p) {
    (p.milestones || []).forEach(function(m) {
      var d = new Date(m.date);
      var diff = (d - now) / 86400000;
      if (diff > 0 && diff <= 120) {
        upcoming.push({ project: p.id, projectName: p.name, milestone: m.name, date: m.date, dateObj: d, deliverableCount: (m.deliverables || []).length });
      }
    });
  });
  if (upcoming.length < 3) return clusterItems;
  // Sort by date
  upcoming.sort(function(a, b) { return a.dateObj - b.dateObj; });
  // Sliding window: find groups of ≥3 milestones within 21 days
  // N8 fix: track consumed milestone indices to prevent overlapping near-duplicate alerts
  var consumed = {};
  for (var i = 0; i < upcoming.length; i++) {
    if (consumed[i]) continue; // already part of a reported cluster
    var cluster = [upcoming[i]];
    var clusterIdx = [i];
    for (var j = i + 1; j < upcoming.length; j++) {
      if (consumed[j]) continue;
      if ((upcoming[j].dateObj - upcoming[i].dateObj) / 86400000 <= 21) {
        cluster.push(upcoming[j]);
        clusterIdx.push(j);
      } else break;
    }
    if (cluster.length >= 3) {
      // Mark all milestones in this cluster as consumed
      clusterIdx.forEach(function(idx) { consumed[idx] = true; });
      var windowKey = cluster.map(function(c) { return c.project; }).sort().join('+');
      var totalDelivs = cluster.reduce(function(s, c) { return s + c.deliverableCount; }, 0);
      var projectNames = cluster.map(function(c) { return c.projectName; });
      var uniqueProjects = projectNames.filter(function(v, idx, arr) { return arr.indexOf(v) === idx; });
      var dateRange = cluster[0].date.slice(5) + ' – ' + cluster[cluster.length - 1].date.slice(5);
      var text = `Resource risk: ${cluster.length} milestones from ${uniqueProjects.length} projects cluster in ${dateRange} (${totalDelivs} deliverables) — review staffing`;
      clusterItems.push({
        tag: 'Cluster Risk',
        tagClass: 'att-cluster-tag',
        text: text,
        project: 'system',
        itemId: 'cluster-' + windowKey,
        signals: { status: 'cluster_risk', milestone_count: cluster.length, deliverable_count: totalDelivs, project_count: uniqueProjects.length },
        isCluster: true,
      });
    }
  }
  return clusterItems;
}

// Drift action: confirm or reset weight
function dleDriftConfirm(key) {
  // Clone before mutating — onSnapshot returns frozen objects
  var newCD = Object.assign({}, dleState.confirmedDrifts);
  newCD[key] = {
    weight: dleState.projectWeights[key] || 0,
    ts: new Date().toISOString(),
  };
  dleState.confirmedDrifts = newCD;
  dleLogDecision({
    item_type: 'drift_confirm',
    item_id: 'drift-' + key,
    project: 'system',
    signals: { drift_key: key, current_weight: dleState.projectWeights[key] },
    rank_shown: null,
    action: 'confirmed',
  });
  var proj = projects.find(function(p) { return p.id === key; });
  var name = proj ? proj.name : key;
  showToast(`"${name}" weight confirmed — keeping current distribution`);
  console.log('[DRIFT] Confirm:', key);
  _dleGuardSet();
  dbSaveDleState().then(_dleGuardClear).catch(_dleGuardClear);
  renderOverview();
}

function dleDriftReset(key) {
  console.log('[DRIFT] Reset called for:', key);
  try {
    var activeKeys = Object.keys(dleState.projectWeights).filter(function(k) { return k === key || dleState.projectWeights[k] > 0; });
    var activeCount = Math.max(activeKeys.length, 1);
    var avgShare = 1.0 / activeCount;
    // Clone before mutating — onSnapshot returns frozen objects
    var newPW = Object.assign({}, dleState.projectWeights);
    newPW[key] = avgShare;
    dleState.projectWeights = newPW;
    // Confirm the new weight so obsDriftCheck skips this key even if a stale onSnapshot re-renders
    var newCD = Object.assign({}, dleState.confirmedDrifts);
    newCD[key] = { weight: avgShare, ts: new Date().toISOString() };
    dleState.confirmedDrifts = newCD;
    dleLogDecision({
      item_type: 'drift_reset',
      item_id: 'drift-' + key,
      project: 'system',
      signals: { drift_key: key, reset_to: avgShare, active_count: activeCount },
      rank_shown: null,
      action: 'reset',
    });
    var proj = projects.find(function(p) { return p.id === key; });
    var name = proj ? proj.name : key;
    showToast(`${name} reset to ${Math.round(avgShare * 100)}% (avg across ${activeCount} active projects)`);
    console.log('[DRIFT] Reset:', key, '→', avgShare);
    _dleGuardSet();
    dbSaveDleState().then(_dleGuardClear).catch(function(e) { console.warn('[DRIFT] DB save failed:', e); _dleGuardClear(); });
    renderOverview();
  } catch (err) {
    console.error('[DRIFT] Reset error:', err);
    showToast('⚠ Drift reset error: ' + err.message);
  }
}

// ── Load projects from DB config ──
// Reads config/projects-* documents and replaces the hardcoded projects array.
// Falls back to the hardcoded array if DB is unavailable or returns nothing.
async function loadProjectsFromConfig(db) {
  try {
    var snap = await db.collection('config').where('id', '!=', '').limit(100).get();
    // Filter for projects-* docs only
    var projDocs = [];
    (snap.docs || []).forEach(function(doc) {
      if (doc.id.startsWith('projects-')) {
        // Clone frozen snapshot so properties are mutable
        var d = _deepClone(doc.data());
        // Strip stale recentActivity from config — Scout's state/dashboard is the authority
        delete d.recentActivity;
        projDocs.push(d);
      }
    });
    if (!projDocs.length) {
      console.log('[DB] No config/projects-* docs found — keeping hardcoded fallback');
      projects.forEach(function(p) { _projectDbState[p.id] = 'error'; });
      return;
    }
    // Sort by priority (ascending)
    projDocs.sort(function(a, b) { return (a.priority || 99) - (b.priority || 99); });
    // Replace global projects array
    projects = projDocs.map(function(d) {
      // Ensure milestones have deliverables arrays
      (d.milestones || []).forEach(function(m) { m.deliverables = m.deliverables || []; });
      return d;
    });
    // Also populate _sourceConfigs from the embedded sources field and sync dataSources
    projDocs.forEach(function(d) {
      if (d.sources) {
        _sourceConfigs[d.id] = d.sources;
        _syncDataSourcesFromConfig(d.id, d.sources);
      }
    });
    _projectsLoadedFromDb = true;
    _dataSource = _dataSource === 'mock' ? 'live' : _dataSource;
    projDocs.forEach(function(d) { _projectDbState[d.id] = 'live'; });
    console.log('[DB] Projects loaded from config —', projDocs.length, 'projects:', projDocs.map(function(d) { return d.id; }).join(', '));
    renderOverview();
    if (currentProject) { renderDetailTabs(); renderDetailBody(); }
  } catch (e) {
    console.warn('[DB] Failed to load projects from config:', e.message || e);
    projects.forEach(function(p) { if (!_projectDbState[p.id]) _projectDbState[p.id] = 'error'; });
  }
}

// ── Comms correlation engine ──
// Determines which project a message belongs to based on source, sender, and keywords
function correlateProject(msg, partnerRules) {
  if (!partnerRules) return { project: msg.project || null, confidence: 'low', method: 'passthrough' };

  var source = (msg.source || '').toLowerCase();
  var from = (msg.from || '').toLowerCase();
  var subject = (msg.subject || '').toLowerCase();
  var body = (msg.body || msg.snippet || '').toLowerCase();
  var text = subject + ' ' + body;

  // Internal (your own org) domains
  var isInternal = (partnerRules.internalDomains || ['example.com']).some(function(d) {
    return from.indexOf('@' + d) !== -1;
  });

  // Overarching entities — never assign to a project by sender alone
  var isOverarching = false;
  (partnerRules.overarchingEntities && partnerRules.overarchingEntities.entities || []).forEach(function(ent) {
    (ent.domains || []).forEach(function(d) { if (from.indexOf(d) !== -1) isOverarching = true; });
    (ent.names || []).forEach(function(n) { if (from.indexOf(n.toLowerCase()) !== -1) isOverarching = true; });
  });

  // Build sender → project(s) map from consortium lists
  var senderProjects = [];
  var knownPartners = partnerRules.knownPartners || {};
  var mergeMap = partnerRules.mergeMap || {};

  if (!isInternal && !isOverarching) {
    Object.keys(knownPartners).forEach(function(projId) {
      var kp = knownPartners[projId];
      var allSlugs = (kp.consortium || []).concat(kp.customer || []);
      allSlugs.forEach(function(slug) {
        // Apply merge map
        var effectiveSlug = mergeMap[slug] || slug;
        // Check if sender email domain or name matches this partner slug
        // Slug matching: 'partner-a' matches '@partner-a.example', etc.
        // Also check display name contains the slug
        if (from.indexOf(effectiveSlug) !== -1 || from.indexOf(slug) !== -1) {
          senderProjects.push(projId);
        }
      });
    });
  }

  // Keyword matching per project from source configs
  // First pass: collect all keywords per project
  var projectKeywords = {}; // projId → [lowered keywords]
  Object.keys(_sourceConfigs).forEach(function(projId) {
    var cfg = _sourceConfigs[projId];
    var allKw = [];
    if (cfg.slack && cfg.slack.keywords) allKw = allKw.concat(cfg.slack.keywords);
    if (cfg.email && cfg.email.keywords) allKw = allKw.concat(cfg.email.keywords);
    if (cfg.calendar && cfg.calendar.keywords) allKw = allKw.concat(cfg.calendar.keywords);
    var seen = {};
    projectKeywords[projId] = allKw.map(function(k) { return k.toLowerCase(); }).filter(function(lk) {
      if (seen[lk]) return false; seen[lk] = true; return true;
    });
  });

  // Build exclusive keyword map: keywords that appear in only ONE project
  var kwOwnerCount = {}; // lowered keyword → count of projects that have it
  Object.keys(projectKeywords).forEach(function(projId) {
    projectKeywords[projId].forEach(function(lk) {
      kwOwnerCount[lk] = (kwOwnerCount[lk] || 0) + 1;
    });
  });

  var keywordMatches = [];
  var exclusiveMatches = []; // projects matched by a keyword unique to them
  Object.keys(projectKeywords).forEach(function(projId) {
    var matched = false;
    var exclusiveHit = false;
    projectKeywords[projId].forEach(function(lk) {
      if (text.indexOf(lk) !== -1) {
        matched = true;
        if (kwOwnerCount[lk] === 1) exclusiveHit = true;
      }
    });
    if (matched) keywordMatches.push(projId);
    if (exclusiveHit) exclusiveMatches.push(projId);
  });
  // Deduplicate
  keywordMatches = keywordMatches.filter(function(v, i, a) { return a.indexOf(v) === i; });
  exclusiveMatches = exclusiveMatches.filter(function(v, i, a) { return a.indexOf(v) === i; });

  // Decision logic — source-dependent
  // 1a. Single exclusive keyword match → highest confidence (e.g. a unique codeword → one project)
  if (exclusiveMatches.length === 1) {
    return { project: exclusiveMatches[0], confidence: 'high', method: 'keyword-exclusive' };
  }
  // 1b. Single keyword match overall → high confidence
  if (keywordMatches.length === 1) {
    return { project: keywordMatches[0], confidence: 'high', method: 'keyword' };
  }

  // 2. For Teams/Email: sender identity is strong signal
  if ((source === 'teams' || source === 'email') && !isInternal && !isOverarching) {
    if (senderProjects.length === 1) {
      return { project: senderProjects[0], confidence: 'high', method: 'sender' };
    }
    if (senderProjects.length > 1) {
      // Sender on multiple projects — keyword narrows
      var overlap = senderProjects.filter(function(p) { return keywordMatches.indexOf(p) !== -1; });
      if (overlap.length === 1) {
        return { project: overlap[0], confidence: 'high', method: 'sender+keyword' };
      }
      // Two-project ambiguity: default to the active project
      if (senderProjects.indexOf('p1') !== -1 && senderProjects.indexOf('p2') !== -1) {
        return { project: 'p1', confidence: 'medium', method: 'sender-default-p1', flagged: true };
      }
      return { project: senderProjects[0], confidence: 'low', method: 'sender-ambiguous', flagged: true };
    }
  }

  // 3. For Slack: internal channel, keyword is the only real signal
  if (source === 'slack') {
    if (keywordMatches.length > 1) {
      // Multiple keyword matches — exclusive keyword wins
      if (exclusiveMatches.length === 1) return { project: exclusiveMatches[0], confidence: 'high', method: 'keyword-exclusive' };
      if (keywordMatches.indexOf('p1') !== -1 && keywordMatches.indexOf('p2') !== -1) {
        return { project: 'p1', confidence: 'medium', method: 'keyword-default-p1', flagged: true };
      }
      return { project: keywordMatches[0], confidence: 'medium', method: 'keyword-multi', flagged: true };
    }
    // No keyword match on Slack — can't determine project
    return { project: null, confidence: 'none', method: 'slack-no-keyword', flagged: true };
  }

  // 4. Multiple keyword matches on non-Slack — exclusive keyword wins
  if (keywordMatches.length > 1) {
    if (exclusiveMatches.length === 1) return { project: exclusiveMatches[0], confidence: 'high', method: 'keyword-exclusive' };
    return { project: keywordMatches[0], confidence: 'medium', method: 'keyword-multi', flagged: true };
  }

  // 5. Fallback: keep original project assignment if any
  if (msg.project) {
    return { project: msg.project, confidence: 'low', method: 'original' };
  }

  return { project: null, confidence: 'none', method: 'unresolved', flagged: true };
}

// ── Ingest comms + calendar from state/pull-latest ("the fridge"). ──
// Root-cause fix: AGT-COORD no longer copies these big arrays into
// state/dashboard (that copy is what compacted and corrupted them).
// The dashboard reads them straight from pull-latest and filters client-side.
function _ingestComms(rawComms) {
  if (!rawComms || !rawComms.length) return;
  var pIdMap = { 'ALPHA':'p1', 'BETA':'p2', 'GAMMA':'p3' };
  var existingById = {}, existingByFp = {};
  commsMessages.forEach(function(em) {
    existingById[em.id] = em;
    var fp = ackFingerprint(em); if (fp) existingByFp[fp] = em;
  });
  var incoming = rawComms
    .filter(function(m) { return m && (m.time || m.date); })  // guard: drop null-time stubs from a degraded pull
    .map(function(m) {
      var n = Object.assign({}, m, {
        project: pIdMap[m.project] || (m.project || '').toLowerCase() || null,
        time: m.time || m.date || '',
        flag: m.flag || 'info',
        acked: !!m.acked,
        body: m.body || m.snippet || '',
        subject: m.subject || ''
      });
      if (_partnerRules) {
        var corr = correlateProject(n, _partnerRules);
        if (corr.project) n.project = pIdMap[corr.project] || corr.project;
        n._corr = { confidence: corr.confidence, method: corr.method };
        if (corr.flagged) { n.flag = n.flag === 'info' ? 'review' : n.flag; n._corrFlagged = true; }
      }
      var textToCheck = ((n.body || '') + ' ' + (n.subject || '')).toLowerCase();
      if (['you@example.com','@you','your name'].some(function(p){ return textToCheck.indexOf(p) !== -1; }) && n.flag === 'info') {
        n.flag = 'review'; n._mentioned = true;
      }
      return n;
    });
  // guard: a degraded pull with no valid messages must NOT blank the feed
  if (!incoming.length && commsMessages.length) {
    console.warn('[Pull] pull-latest had no valid-time messages — keeping current feed');
    return;
  }
  incoming.forEach(function(nm) {
    var ex = existingById[nm.id] || existingByFp[ackFingerprint(nm)];
    if (ex && ex._moved) { nm._moved = ex._moved; nm.project = ex.project; }
  });
  commsMessages = incoming;
  try { applyAcksToMessages(); } catch (e) { console.warn('[Pull] applyAcks err:', e.message); }
  try { applyMovesToMessages(); } catch (e) { console.warn('[Pull] applyMoves err:', e.message); }
  try { applyRejectionsToMessages(); } catch (e) { console.warn('[Pull] applyRejections err:', e.message); }
}
function _ingestCalendar(rawCal) {
  if (rawCal && rawCal.length) calendarEvents = _mapCalendarEvents(rawCal);
}

async function initDb() {
  try {
    const db = await window.claude.use('db');
    if (!db) { console.log('[DB] Not available — using mock data'); return; }
    _db = db;

    // Flush any acks/moves that were queued before DB connected
    if (_ackSaveQueued && Object.keys(_ackedMessages).length > 0) {
      console.log('[DB] Flushing', Object.keys(_ackedMessages).length, 'queued acks');
      dbSaveAcks();
    }

    // Load project definitions from config/projects-* (replaces hardcoded array)
    await loadProjectsFromConfig(db);

    // Subscribe to dashboard state (projects, comms, partners, calendar)
    _db.doc('state/dashboard').onSnapshot(snap => {
      try {
      if (snap.exists) {
        const d = snap.data();
        if (d.projects && d.projects.length) {
          var idMap = { 'ALPHA':'p1', 'BETA':'p2', 'GAMMA':'p3' };
          if (_projectsLoadedFromDb) {
            // Projects already loaded from config/projects-* — only overlay real-time fields from scout
            var projLookup = {};
            projects.forEach(function(p) { projLookup[p.id] = p; });
            d.projects.forEach(function(dp) {
              var pid = idMap[dp.id] || dp.id.toLowerCase();
              var target = projLookup[pid];
              if (!target) return;
              // Scout writes real-time status + recentActivity + summaries; overlay those
              if (dp.status) target.status = _normalizeStatus(dp.status);
              if (dp.recentActivity) target.recentActivity = dp.recentActivity; // accept both array and string
              if (dp.notes) target.notes = dp.notes;
              if (dp.summaryBaseline) { target.summaryBaseline = dp.summaryBaseline; }
              if (dp.summaryRecent !== undefined) { target.summaryRecent = dp.summaryRecent; }
              if (dp.weeklyLog) { target.weeklyLog = dp.weeklyLog; }
              if (dp.baselineProposal !== undefined) { target.baselineProposal = dp.baselineProposal; }
              // Persist dashboard overlay data in a clobber-proof map
              if (dp.summaryBaseline || dp.summaryRecent !== undefined || dp.weeklyLog || dp.baselineProposal !== undefined || dp.notes || dp.status || dp.recentActivity) {
                var ds = _dashboardSummaries[pid] || {};
                if (dp.summaryBaseline) ds.summaryBaseline = dp.summaryBaseline;
                if (dp.summaryRecent !== undefined) ds.summaryRecent = dp.summaryRecent;
                if (dp.weeklyLog) ds.weeklyLog = dp.weeklyLog;
                if (dp.baselineProposal !== undefined) ds.baselineProposal = dp.baselineProposal;
                if (dp.notes) ds.notes = dp.notes;
                if (dp.status) ds.status = dp.status;
                if (dp.recentActivity) ds.recentActivity = dp.recentActivity; // accept both array and string
                _dashboardSummaries[pid] = ds;
                console.log('[DB] Dashboard summaries cached for', pid, '— baseline:', (ds.summaryBaseline || '').slice(0,40), 'weeklyLog:', (dp.weeklyLog || []).length);
              }
              // Overlay deliverable statuses from scout without replacing full milestone structure
              if (dp.milestones && dp.milestones.length) {
                dp.milestones.forEach(function(dm) {

          try { applyRejectionsToMessages(); } catch (e) { console.warn('[DB] applyRejectionsToMessages error (rejections snap):', e.message); }
          scheduleRender();

        }
      }
    }, function(e) { console.warn('[DB] rejections snapshot error:', e.code); });

    // Subscribe to dismissed attention items
    _db.doc('state/dismissals').onSnapshot(function(snap) {
      if (snap.exists) {
        var d = snap.data();
        if (d.items) {
          _dismissedItems = _cloneMap(d); // frozen-snapshot guard (see _cloneMap)
          scheduleRender();
          console.log('[DB] Dismissals loaded —', Object.keys(_dismissedItems).length, 'items');
        }
      }
    }, function(e) { console.warn('[DB] dismissals snapshot error:', e.code); });

    console.log('[DB] Connected — subscriptions active');
  } catch (e) {
    console.error('[DB] Init failed:', e);
  }
}

// Save/load acknowledged comms messages
let _ackSaveQueued = false; // true when acks were modified before DB connected
// P1/A3: drop junk legacy ack entries so they are never matched against or written back.
// Junk = retired bulk-ack stubs (source "comms", e.g. fp "comms|<projectId>" → sig "comms§<proj>§"),
// empty-subject/empty-sender sigs (unmatchable), and non-object item values (a stray bare string).
function _sanitizeAckStores() {
  try {
    Object.keys(_ackSigs).forEach(function(k) {
      var p = ('' + k).split('§');
      if ((p[0] || '') === 'comms' || !(p[1] || '') || !(p[2] || '')) delete _ackSigs[k];
    });
    Object.keys(_ackedMessages).forEach(function(id) {
      var a = _ackedMessages[id];
      if (!a || typeof a !== 'object') { delete _ackedMessages[id]; return; }
      if (typeof a.fp === 'string' && a.fp.indexOf('comms|') === 0) delete _ackedMessages[id];
    });
  } catch (e) { console.warn('[Ack] sanitize err:', e.message); }
}

async function dbSaveAcks(retryCount) {
  if (!_db) {
    console.warn('[DB] dbSaveAcks: _db not ready — queuing for flush on connect');
    _ackSaveQueued = true;
    return;
  }
  // Guard: never overwrite DB with potentially empty/partial acks before
  // the state/acks snapshot has loaded the authoritative set from DB.
  // The only exception is the queue-flush path in initDb() which sets
  // _ackSaveQueued — those acks came from localStorage or prior session.
  if (!_acksLoadedFromDb && !_ackSaveQueued) {
    console.warn('[DB] dbSaveAcks: acks not yet loaded from DB — skipping to prevent overwrite');
    return;
  }
  var attempt = retryCount || 0;
  _acksSavePending = true;
  try {
    // A4: read-merge-write. The db is last-writer-wins with a full-replace set() and no
    // version pin, so a blind set() would clobber a concurrent tab's acks. Union the live
    // doc into our local maps first (local wins on conflict — we just changed those keys),
    // so the write only ever ADDS, never drops someone else's ack.
    var remoteSigs = {}, remoteItems = {};
    try {
      var _snap = await _db.doc('state/acks').get();
      if (_snap && _snap.exists) { var _rd = _snap.data() || {}; remoteSigs = _rd.sigs || {}; remoteItems = _rd.items || {}; }
    } catch (ge) { console.warn('[DB] Acks pre-read failed — writing local only:', ge && ge.code); }
    Object.keys(remoteSigs).forEach(function(k) { if (!_ackSigs[k]) _ackSigs[k] = remoteSigs[k]; });
    Object.keys(remoteItems).forEach(function(k) { if (!_ackedMessages[k]) _ackedMessages[k] = remoteItems[k]; });
    // Retention: drop signatures older than 180 days (well past the 30-day message window)
    var _cut = Date.now() - 180 * 24 * 3600 * 1000;
    Object.keys(_ackSigs).forEach(function(s) {
      var at = _ackSigs[s] && _ackSigs[s].at;
      var t = at ? Date.parse(('' + at).replace(' ', 'T')) : NaN;
      if (!isNaN(t) && t < _cut) delete _ackSigs[s];
    });
    _sanitizeAckStores(); // never write junk back, even if the remote still held it
    var payload = { items: _ackedMessages, sigs: _ackSigs };
    console.log('[DB] Acks saving —', Object.keys(_ackedMessages).length, 'items,', Object.keys(_ackSigs).length, 'sigs (merged)');
    await _db.doc('state/acks').set(payload);
    console.log('[DB] Acks saved OK —', Object.keys(_ackedMessages).length, 'entries');
    _ackSaveQueued = false;
  } catch (e) {
    console.warn('[DB] Acks save attempt', attempt + 1, 'FAILED:', e.code, e.message);
    // Silent retry on transient errors (unavailable, deadline-exceeded) — toast only on final failure
    if (attempt < 2 && (e.code === 'unavailable' || e.code === 'deadline-exceeded' || e.code === 'resource-exhausted')) {
      _acksSavePending = false;
      var delay = (attempt + 1) * 2000;
      console.log('[DB] Retrying ack save in', delay, 'ms (attempt', attempt + 2 + ')');
      setTimeout(function() { dbSaveAcks(attempt + 1); }, delay);
      return;
    }
    showToast('⚠ Ack save failed: ' + (e.code || e.message));
  } finally {
    _acksSavePending = false;
  }
}

  else if (commsFilter === 'info') filtered = msgs.filter(function(m) { return m.flag === 'info' && !m.acked; });

    _ackSigs[ackSig(m)] = { at: at, subject: m.subject || '', from: m.from || '', source: m.source || '', msgDate: _md };
    n++;
  });
  if (n) { dbSaveAcks(); showToast('Acknowledged ' + n + ' message' + (n > 1 ? 's' : '')); renderDetailBody(); }
  else showToast('Nothing to acknowledge in this view');

function applyAcksToMessages() {
  // Reapply persisted ack state to in-memory messages after db reload
  // Build fingerprint→ack lookup for fallback matching when IDs drift
  var fpLookup = {};
  // Also build subject-only lookup as last-resort fallback
  var subjectLookup = {};
  // Normalized-subject lookup: strips Re:/FW:/Vs: and normalizes dashes
  var normSubjectLookup = {};
  // Normalized-fingerprint lookup: same as fpLookup but with normalized subjects
  var normFpLookup = {};
  Object.keys(_ackedMessages).forEach(function(id) {
    var a = _ackedMessages[id];
    if (a.fp) {
      fpLookup[a.fp] = a;
      // Extract subject from fingerprint (format: source|subject|from)
      var parts = a.fp.split('|');
      if (parts.length >= 2 && parts[1]) {
        subjectLookup[parts[1]] = a;
        var ns = _normSubject(parts[1]);
        if (ns) normSubjectLookup[ns] = a;
      }
      // Build normalized fingerprint (source|normSubject|from)
      if (parts.length >= 3) {
        var normFp = parts[0] + '|' + _normSubject(parts[1]) + '|' + parts.slice(2).join('|');
        normFpLookup[normFp] = a;
      }
    }
  });
  var migratedCount = 0;
  commsMessages.forEach(function(m) {
    // AUTHORITY: pull-stable signature — the definitive suppression check.
    // Once acked, any future message reducing to this signature stays hidden.
    var _asig = _ackSigs[ackSig(m)];
    if (_asig && _ackMatchesDate(_asig, m)) {
      m.acked = true;
      m.ackedAt = _asig.at || m.ackedAt || '';
      return;
    }
    // MUTE: sender the user muted — auto-suppress, treated as acked
    var _sk = _senderKey(m.from);
    if (_sk && _mutedSenders[_sk]) {
      m.acked = true; m._muted = true; m.ackedAt = m.ackedAt || 'muted';
      return;
    }
    // Primary: exact ID match (same message — authoritative, never date-guarded)
    var ack = _ackedMessages[m.id];
    if (!ack) {
      // Fuzzy fallbacks (fingerprint / normalized / subject) can over-match a NEW reply in an
      // already-acked thread, so a candidate is accepted ONLY if it passes the date guard.
      var cand = fpLookup[ackFingerprint(m)];
      if (!cand) {
        var _src = (m.source || '').toLowerCase(); if (_src === 'outlook') _src = 'email';
        cand = normFpLookup[_src + '|' + _normSubject(m.subject) + '|' + (m.from || '')];
      }
      if (!cand && m.subject) {
        cand = subjectLookup[m.subject];
        if (!cand) { var ns = _normSubject(m.subject); if (ns) cand = normSubjectLookup[ns]; }
      }
      if (cand && _ackMatchesDate(cand, m)) {
        ack = cand;
        _ackedMessages[m.id] = { at: ack.at, fp: ackFingerprint(m), msgDate: (m.time || '').slice(0, 10) };
        migratedCount++;
      }
    }
    if (ack) {
      m.acked = true;
      m.ackedAt = ack.at || '';
      // Self-heal: promote to a pull-stable signature scoped to THIS message's date, so it
      // suppresses only this message (and older re-pulls), never future replies in the thread.
      var _psig = ackSig(m);
      if (!_ackSigs[_psig]) {
        _ackSigs[_psig] = { at: ack.at || '', subject: m.subject || '', from: m.from || '', source: m.source || '', msgDate: (m.time || '').slice(0, 10) };
        migratedCount++;
      }
      if (!ack.fp && m.source && m.subject) { ack.fp = ackFingerprint(m); migratedCount++; }
    }
  });
  // Persist migrations so new IDs and backfilled fingerprints survive page reload
  if (migratedCount > 0) {
    console.log('[Ack] applyAcksToMessages migrated', migratedCount, 'entries — scheduling heal-save');
    _scheduleAckHealSave();
  }
}

let _govActive = false;

function toggleGovernance() {

async function loadGovernanceCanvases() {
  var content = document.getElementById('govContent');
  content.innerHTML = '<div class="gov-loading"><div class="spinner"></div>Loading canvases from database…</div>';
  try {
    if (!_db) { content.innerHTML = '<div class="gov-error">Database not available — canvases cannot be loaded</div>'; return; }
    // Query config collection for canvas-* documents
    var snap = await _db.collection('config').where('canvasId', '!=', '').limit(100).get();
    var canvases = [];
    (snap.docs || []).forEach(function(doc) {
      var d = doc.data();
      if (doc.id.startsWith('canvas-') && d.content) {
        _govCanvasCache[doc.id] = d;
        canvases.push({ docId: doc.id, canvasId: d.canvasId, title: d.title, version: d.version, status: d.status });
      }
    });
    // Sort: SYS first, then AGT by number
    canvases.sort(function(a, b) {
      if (a.canvasId.startsWith('SYS') && !b.canvasId.startsWith('SYS')) return -1;
      if (!a.canvasId.startsWith('SYS') && b.canvasId.startsWith('SYS')) return 1;
      return a.canvasId.localeCompare(b.canvasId);
    });
    _govLoaded = true;
    renderGovNav(canvases);
    if (canvases.length > 0) {
      selectGovCanvas(canvases[0].docId);
    } else {
      content.innerHTML = '<div class="gov-loading">No governance canvases found in database.<br>Write canvases to <code>config/canvas-*</code> in the artifact DB.</div>';
    }
  } catch(e) {
    console.warn('[GOV] Load error:', e);
    content.innerHTML = '<div class="gov-error">Error loading canvases: ' + (e.message || e.code || 'unknown') + '</div>';
  }
}

function renderGovPipeline() {
  var el = document.getElementById('govPipelineContent');
  var runs = (_coordLog && _coordLog.runs) || [];

// ── Simple markdown → HTML renderer ──
function renderMarkdown(md) {
  if (!md) return '<div class="gov-loading">No content</div>';
  var lines = md.split('\n');
  var html = '';
  var inCode = false, codeLang = '', codeLines = [];
  var inTable = false, tableRows = [];
  var inBlockquote = false, bqLines = [];
  var inList = false, listType = '', listItems = [];

  function flushList() {
    if (!inList) return;
    var tag = listType === 'ol' ? 'ol' : 'ul';
    html += '<' + tag + '>' + listItems.join('') + '</' + tag + '>';
    inList = false; listItems = []; listType = '';
  }
  function flushBlockquote() {
    if (!inBlockquote) return;
    html += '<blockquote>' + bqLines.join('<br>') + '</blockquote>';
    inBlockquote = false; bqLines = [];
  }
  function flushTable() {
    if (!inTable) return;
    var result = '<table>';
    tableRows.forEach(function(row, ri) {
      var tag = ri === 0 ? 'th' : 'td';
      var rowTag = ri === 0 ? 'thead' : (ri === 1 ? 'tbody' : '');
      if (ri === 0) result += '<thead>';
      if (ri === 2 && tableRows.length > 2) {} // already in tbody
      result += '<tr>' + row.map(function(cell) { return '<' + tag + '>' + inlineFormat(cell.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
      if (ri === 0) result += '</thead><tbody>';
    });
    if (tableRows.length > 1) result += '</tbody>';
    result += '</table>';
    html += result;
    inTable = false; tableRows = [];
  }

  function inlineFormat(s) {
    // Bold + italic
    s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // Bold
    s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic
    s = s.replace(/(?<![*])\*([^*]+)\*(?![*])/g, '<em>$1</em>');
    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Links
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return s;
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    // Code blocks
    if (line.match(/^```/)) {
      if (inCode) {
        html += '<pre><code>' + codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
        inCode = false; codeLines = [];
      } else {
        flushList(); flushBlockquote(); flushTable();
        inCode = true; codeLang = line.replace(/^```/, '').trim();
      }
      continue;
    }
    if (inCode) { codeLines.push(line); continue; }

    // Table rows
    if (line.match(/^\|.*\|\s*$/)) {
      flushList(); flushBlockquote();
      // Skip separator rows (|---|---|)
      if (line.match(/^\|[\s-:|]+\|\s*$/)) { continue; }
      inTable = true;
      var cells = line.split('|').slice(1, -1);
      tableRows.push(cells);
      continue;
    } else if (inTable) { flushTable(); }

    // Blockquotes
    if (line.match(/^>\s?/)) {
      flushList(); if (inTable) flushTable();
      inBlockquote = true;
      bqLines.push(inlineFormat(line.replace(/^>\s?/, '')));
      continue;
    } else if (inBlockquote) { flushBlockquote(); }

    // Horizontal rules
    if (line.match(/^---+\s*$/)) { flushList(); html += '<hr>'; continue; }

    // Headings
    var hMatch = line.match(/^(#{1,4})\s+(.+)/);
    if (hMatch) { flushList(); html += '<h' + hMatch[1].length + '>' + inlineFormat(hMatch[2]) + '</h' + hMatch[1].length + '>'; continue; }

    // Unordered list
    if (line.match(/^\s*[-*]\s+/)) {
      if (!inList || listType !== 'ul') { flushList(); inList = true; listType = 'ul'; }
      listItems.push('<li>' + inlineFormat(line.replace(/^\s*[-*]\s+/, '')) + '</li>');
      continue;
    }
    // Ordered list
    if (line.match(/^\s*\d+\.\s+/)) {
      if (!inList || listType !== 'ol') { flushList(); inList = true; listType = 'ol'; }
      listItems.push('<li>' + inlineFormat(line.replace(/^\s*\d+\.\s+/, '')) + '</li>');
      continue;
    }
    if (inList && line.trim() === '') { flushList(); continue; }

    // Empty lines
    if (line.trim() === '') { flushList(); continue; }

    // Paragraph
    flushList();
    html += '<p>' + inlineFormat(line) + '</p>';
  }

  // Flush remaining
  if (inCode) html += '<pre><code>' + codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
  flushList(); flushBlockquote(); flushTable();

  return html;
}
