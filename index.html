  function addMsg(role, html) {
    var div = document.createElement('div');
    div.className = 'cmd-msg ' + role;
    div.innerHTML = html;
    body.appendChild(div);
    scrollBody();
    return div;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Local command handlers ──
  function tryLocalCommand(text) {
    var t = text.trim().toLowerCase();

    // status — quick portfolio overview
    if (t === 'status' || t === 'overview') {
      var lines = projects.map(function(p) {
        var statusIcon = p.status === 'on-track' ? '🟢' : p.status === 'at-risk' ? '🟡' : p.status === 'blocked' ? '🔴' : p.status === 'delivered' ? '🔵' : '⚪';
        return statusIcon + ' <strong>' + escHtml(p.name) + '</strong> — ' + escHtml(p.status) + (p.progress != null ? ' (' + p.progress + '%)' : '');
      });
      return lines.join('<br>');
    }

    // weights — DLE weights
    if (t === 'weights' || t === 'dle weights' || t === 'dle') {
      var html = '';
      // Project attention distribution
      var pw = dleState.projectWeights;
      var pwKeys = Object.keys(pw);
      if (pwKeys.length > 0) {
        html += '<strong>Project Attention:</strong>\n';
        var pLines = pwKeys.sort(function(a,b){ return pw[b]-pw[a]; }).map(function(k) {
          var pct = Math.round(pw[k] * 100);
          var bar = '█'.repeat(Math.round(pct / 5)) + '░'.repeat(20 - Math.round(pct / 5));
          var proj = projects.find(function(p) { return p.id === k; });
          var name = proj ? proj.name : k;
          return escHtml(name) + ': ' + bar + ' ' + pct + '%';
        });
        html += pLines.join('\n') + '\n\n';
      }
      // Feature weights
      var w = dleState.weights;
      html += '<strong>Feature Weights:</strong>\n';
      var fLines = Object.keys(w).sort(function(a,b){ return w[b]-w[a]; }).map(function(k) {
        var pct = Math.round(w[k] * 100);
        return escHtml(k.replace(/_/g, ' ')) + ': ' + pct + '%';
      });
      html += fLines.join('\n');
      return '<pre>' + html + '</pre>Total decisions: ' + Math.max(dleState._persistedDecisionCount, dleState.decisionLog.length);
    }

    // unread — unacked comms count per project
    if (t === 'unread' || t === 'comms' || t === 'inbox') {
      var counts = {};
      commsMessages.forEach(function(m) {
        if (!_ackedMessages[m.id]) {
          var pid = m.project || 'unassigned';
          counts[pid] = (counts[pid] || 0) + 1;
        }
      });
      var total = 0;
      var lines = Object.keys(counts).sort().map(function(k) { total += counts[k]; return '<strong>' + escHtml(k) + '</strong>: ' + counts[k]; });
      if (!lines.length) return 'All comms acknowledged ✓';
      return lines.join('<br>') + '<br>—<br>Total unread: <strong>' + total + '</strong>';
    }

    // ack all [project] — bulk acknowledge
    if (t.startsWith('ack all')) {
      var pid = t.replace('ack all', '').trim();
      var count = 0;
      commsMessages.forEach(function(m) {
        if (!_ackedMessages[m.id]) {
          var mp = (m.project || '').toLowerCase();
          if (!pid || mp === pid || mp.indexOf(pid) >= 0) {
            _ackedMessages[m.id] = { at: Date.now(), fp: ackFingerprint(m) };
            dleLogDecision({ action_type: 'comms_ack', item_type: 'comms_ack', project: m.project || 'unknown', detail: 'bulk ack via command panel: ' + (m.subject || m.id) });
            count++;
          }
        }
      });
      if (count > 0) {
        dbSaveAcks();
        renderOverview();
      }
      return count > 0 ? 'Acknowledged <strong>' + count + '</strong> message' + (count > 1 ? 's' : '') + (pid ? ' for ' + escHtml(pid) : '') : 'No unread messages' + (pid ? ' for ' + escHtml(pid) : '');
    }

    // next milestone
    if (t === 'next milestone' || t === 'milestones' || t === 'upcoming') {
      var upcoming = [];
      var now = new Date();
      projects.forEach(function(p) {
        (p.milestones || []).forEach(function(m) {
          var d = new Date(m.date);
          if (d >= now) upcoming.push({ project: p.name, name: m.name, date: m.date, days: Math.ceil((d - now) / 86400000) });
        });
      });
      upcoming.sort(function(a,b) { return a.days - b.days; });
      if (!upcoming.length) return 'No upcoming milestones found';
      return upcoming.slice(0, 6).map(function(u) {
        return '<strong>' + escHtml(u.project) + '</strong>: ' + escHtml(u.name) + ' — ' + u.date + ' (' + u.days + 'd)';
      }).join('<br>');
    }

    // partners — partner pulse summary
    if (t === 'partners' || t === 'partner pulse') {
      var pa = partnerActivity;
      var lines = [];
      Object.keys(pa).forEach(function(pid) {
        var partners = pa[pid];
        Object.keys(partners).forEach(function(name) {
          var p = partners[name];
          var days = p.lastSeen ? daysSince(p.lastSeen) : null;
          var ago = days === null ? 'no signal' : days === 0 ? 'today' : days + 'd ago';
          var dot = days === null ? '⚪' : days === 0 ? '🟢' : days <= 3 ? '🟢' : days <= 7 ? '🟡' : '🔴';
          lines.push(dot + ' ' + escHtml(name) + ' (' + escHtml(pid) + ') — ' + ago);
        });
      });
      return lines.length ? lines.join('<br>') : 'No partner activity data';
    }

    // calendar — next events
    if (t === 'calendar' || t === 'events' || t === 'meetings') {
      var cal = typeof calEvents !== 'undefined' ? calEvents : [];
      if (!cal.length) return 'No calendar events loaded';
      return cal.slice(0, 5).map(function(ev) {
        var dt = ev.date || (ev.start ? ev.start.split('T')[0] : '—');
        var tm = ev.time || (ev.start ? ev.start.split('T')[1] || '' : '');
        return '<strong>' + escHtml(ev.title || ev.subject || '(no title)') + '</strong> — ' + dt + (tm ? ' ' + tm.slice(0,5) : '') + (ev.project ? ' [' + escHtml(ev.project) + ']' : '');
      }).join('<br>');
    }

    // help
    if (t === 'help' || t === '?') {
      return '<strong>Local commands (instant):</strong><br>' +
        '<code>status</code> — portfolio overview<br>' +
        '<code>weights</code> — DLE attention weights<br>' +
        '<code>unread</code> — unacked comms count<br>' +
        '<code>ack all [project]</code> — bulk acknowledge<br>' +
        '<code>next milestone</code> — upcoming milestones<br>' +
        '<code>partners</code> — partner pulse summary<br>' +
        '<code>calendar</code> — upcoming events<br>' +
        '<code>help</code> — this list<br><br>' +
        '<strong>Claude actions</strong> (natural language):<br>' +
        'Ack messages · Move messages between projects · Change project status · Log decisions · Mark milestones delivered · Update deliverable status · Dismiss attention items · Check calendar · Find free time<br><br>' +
        '<em>Example: "ack all Project Alpha messages", "mark Project Beta as on-track", or "when am I free tomorrow?"</em>';
    }

    return null; // not a local command
  }

  // ── Build context for Claude ──
  function buildContext() {
    var ctx = 'You are an assistant embedded in a Portfolio Dashboard for your organization and its projects.\n';
    ctx += 'Current date: ' + new Date().toISOString().split('T')[0] + '\n';
    ctx += 'You have tools to take actions on the dashboard. Use them when the user asks you to do something (ack messages, change status, log decisions, etc). Confirm what you did after each action.\n';
    ctx += 'You also have calendar tools (check_calendar, find_free_time) that access the user\'s live Outlook calendar via Microsoft 365. Use check_calendar to look up meetings, and find_free_time to find available slots. For find_free_time, convert dates to ISO 8601 UTC. When showing free time, prefer working hours (09:00–18:00 EET/EEST) unless the user says otherwise.\n\n';

    // Projects summary
    ctx += '## Projects\n';
    projects.forEach(function(p) {
      ctx += '- ' + p.name + ' (' + p.id + '): status=' + p.status + ', progress=' + (p.progress || '?') + '%, stream=' + (p.stream || '?');
      if (p.contract) ctx += ', contract=' + p.contract;
      ctx += '\n';
      // Milestones & deliverables
      (p.milestones || []).forEach(function(m) {
        ctx += '  Milestone: ' + (m.id || m.name) + ' — ' + m.name + ' (date: ' + (m.date || '?') + ')\n';
        (m.deliverables || []).forEach(function(d) {
          ctx += '    - [' + (d.id || '?') + '] ' + (d.title || d.name || '?') + ' status=' + (d.status || 'pending') + (d.due ? ' due=' + d.due : '') + '\n';
        });
      });
    });

    // DLE weights
    ctx += '\n## DLE Attention Weights\n';
    var pw = dleState.projectWeights;
    if (Object.keys(pw).length > 0) {
      ctx += 'Project attention distribution:\n';
      Object.keys(pw).sort(function(a,b){ return pw[b]-pw[a]; }).forEach(function(k) {
        ctx += '- ' + k + ': ' + Math.round(pw[k]*100) + '%\n';
      });
    }
    ctx += 'Feature weights:\n';
    var w = dleState.weights;
    Object.keys(w).sort(function(a,b){ return w[b]-w[a]; }).forEach(function(k) {
      ctx += '- ' + k + ': ' + Math.round(w[k]*100) + '%\n';
    });
    ctx += 'Total decisions: ' + Math.max(dleState._persistedDecisionCount, dleState.decisionLog.length) + '\n';

    // Recent decisions
    var recentDec = dleState.decisionLog.slice(-10);
    if (recentDec.length) {
      ctx += '\n## Recent Decisions (last ' + recentDec.length + ')\n';
      recentDec.forEach(function(d) {
        ctx += '- [' + (d.action_type || '?') + '] ' + (d.project || '?') + ': ' + (d.detail || '') + '\n';
      });
    }

    // Persisted notes & decisions (from Activity tab — logged via chat or manual entry)
    var allNotes = dleState._persistedDecisions || [];
    if (allNotes.length) {
      ctx += '\n## Project Notes & Decisions (logged)\n';
      projects.forEach(function(p) {
        var pNotes = allNotes.filter(function(d) { return d.project === p.id; });
        if (!pNotes.length) return;
        pNotes.sort(function(a, b) { return (b.at || '').localeCompare(a.at || ''); });
        // Include up to 5 most recent per project
        pNotes.slice(0, 5).forEach(function(d) {
          var dateStr = d.at ? d.at.slice(0, 10) : '';
          ctx += '- ' + p.name + ' [' + (d.type || 'note') + '] ' + dateStr + ': ' + (d.text || '') + '\n';
        });
      });
      ctx += 'Use these notes when summarising project status, generating baselines, or answering questions about project state and decisions.\n';
    }

    // Unread comms
    var unread = commsMessages.filter(function(m) { return !_ackedMessages[m.id]; });
    ctx += '\n## Unread Comms (' + unread.length + ')\n';
    unread.slice(0, 20).forEach(function(m) {
      ctx += '- id=' + m.id + ' [' + (m.source || '?') + '] ' + (m.project || '?') + ': "' + (m.subject || '(no subject)') + '" from=' + (m.from || '?');
      if (m.direction === 'outbound') ctx += ' SENT to=' + (m.to || '?');
      if (m.mentionsMe) ctx += ' @ME';
      ctx += '\n';
    });
    if (unread.length > 20) ctx += '... and ' + (unread.length - 20) + ' more\n';

    // Sent messages
    var sent = commsMessages.filter(function(m) { return m.direction === 'outbound'; });
    if (sent.length) {
      ctx += '\n## Sent Messages (' + sent.length + ')\n';
      sent.slice(0, 10).forEach(function(m) {
        ctx += '- id=' + m.id + ' [' + (m.source || '?') + '] ' + (m.project || '?') + ': "' + (m.subject || '') + '" to=' + (m.to || '?') + '\n';
      });
    }

    // Upcoming milestones
    var now = new Date();
    var upcoming = [];
    projects.forEach(function(p) {
      (p.milestones || []).forEach(function(m) {
        var d = new Date(m.date);
        if (d >= now) upcoming.push({ project: p.name, id: m.id || m.name, name: m.name, date: m.date, days: Math.ceil((d - now) / 86400000) });
      });
    });
    upcoming.sort(function(a,b){ return a.days - b.days; });
    if (upcoming.length) {
      ctx += '\n## Upcoming Milestones\n';
      upcoming.slice(0, 10).forEach(function(u) {
        ctx += '- ' + u.project + ': ' + u.name + ' (id=' + u.id + ') in ' + u.days + ' days (' + u.date + ')\n';
      });
    }

    // Calendar events
    if (calendarEvents && calendarEvents.length) {
      ctx += '\n## Calendar Events (next 7)\n';
      calendarEvents.slice(0, 7).forEach(function(ev) {
        var dt = ev.date || (ev.start ? ev.start.split('T')[0] : '—');
        var tm = ev.time || (ev.start ? (ev.start.split('T')[1] || '').slice(0,5) : '');
        ctx += '- ' + dt + (tm ? ' ' + tm : '') + ': ' + (ev.title || ev.subject || '(no title)') + (ev.project ? ' [' + ev.project + ']' : '') + '\n';
      });
    }

    // Partner activity
    var paLines = [];
    Object.keys(partnerActivity).forEach(function(pid) {
      var partners = partnerActivity[pid];
      Object.keys(partners).forEach(function(name) {
        var p = partners[name];
        var days = p.lastSeen ? daysSince(p.lastSeen) : null;
        paLines.push({ name: name, project: pid, days: days });
      });
    });
    if (paLines.length) {
      ctx += '\n## Partner Activity\n';
      paLines.sort(function(a,b) { return (b.days || 999) - (a.days || 999); });
      paLines.slice(0, 12).forEach(function(pa) {
        var ago = pa.days === null ? 'no signal' : pa.days === 0 ? 'today' : pa.days + 'd ago';
        ctx += '- ' + pa.name + ' (' + pa.project + '): last seen ' + ago + '\n';
      });
    }

    // Keep under 48KB to leave room for conversation
    if (ctx.length > 48000) ctx = ctx.slice(0, 48000) + '\n[truncated]';
    return ctx;
  }

  // ── Sample tools — actions Claude can execute on the dashboard ──
  function buildSampleTools() {
    return [
      {
        name: 'ack_messages',
        description: 'Acknowledge one or more comms messages. Pass specific message IDs, or a project ID to ack all unread for that project.',
        inputSchema: {
          type: 'object',
          properties: {
            ids: { type: 'array', items: { type: 'string' }, description: 'Specific message IDs to acknowledge' },
            project: { type: 'string', description: 'Project ID — ack all unread messages for this project' }
          }
        },
        execute: function(input) {
          var count = 0;
          if (input.ids && input.ids.length) {
            input.ids.forEach(function(id) {
              if (!_ackedMessages[id]) {
                var m = commsMessages.find(function(x) { return x.id === id; });
                if (m) {
                  var _ackTs = TODAY_STR + ' ' + new Date().toTimeString().slice(0,5);
                  _ackedMessages[id] = { at: _ackTs, fp: ackFingerprint(m) };
                  m.acked = true; m.ackedAt = _ackTs;
                  dleLogDecision({ action_type: 'comms_ack', item_type: 'comms_ack', project: m.project || 'unknown', detail: 'cmd ack: ' + (m.subject || id) });
                  count++;
                }
              }
            });
          } else if (input.project) {
            var pid = input.project.toLowerCase();
            commsMessages.forEach(function(m) {
              if (!_ackedMessages[m.id]) {
                var mp = (m.project || '').toLowerCase();
                if (mp === pid || mp.indexOf(pid) >= 0) {
                  var _ackTs2 = TODAY_STR + ' ' + new Date().toTimeString().slice(0,5);
                  _ackedMessages[m.id] = { at: _ackTs2, fp: ackFingerprint(m) };
                  m.acked = true; m.ackedAt = _ackTs2;
                  dleLogDecision({ action_type: 'comms_ack', item_type: 'comms_ack', project: m.project || 'unknown', detail: 'cmd bulk ack: ' + (m.subject || m.id) });
                  count++;
                }
              }
            });
          }
          if (count > 0) { dbSaveAcks(); renderOverview(); if (currentProject) renderDetailBody(); }
          return count > 0 ? 'Acknowledged ' + count + ' message(s)' : 'No messages to acknowledge';
        }
      },
      {
        name: 'move_message_to_project',
        description: 'Reclassify / move one or more comms messages to a different project — the same action as the dashboard Move-to button. Select messages by explicit IDs, or by a subject/body keyword (e.g. "ZED!" or "Zed!"). Optionally scope to a source project with from_project.',
        inputSchema: {
          type: 'object',
          properties: {
            to_project: { type: 'string', description: 'Target project ID (p1, p2, p3)' },
            ids: { type: 'array', items: { type: 'string' }, description: 'Specific message IDs to move' },
            match: { type: 'string', description: 'Case-insensitive substring matched against message subject + body to select messages (used when ids not given)' },
            from_project: { type: 'string', description: 'Optional: only move messages currently in this project' }
          },
          required: ['to_project']
        },
        execute: function(input) {
          var tp = projects.find(function(x) { return x.id.toLowerCase() === input.to_project.toLowerCase(); });
          if (!tp) return 'Target project not found: ' + input.to_project;
          var targetId = tp.id;
          var sel = [];
          if (input.ids && input.ids.length) {
            input.ids.forEach(function(id) { var m = commsMessages.find(function(x) { return x.id === id; }); if (m) sel.push(m); });
          } else if (input.match) {
            var q = input.match.toLowerCase();
            var fp = input.from_project ? input.from_project.toLowerCase() : null;
            commsMessages.forEach(function(m) {
              var hay = ((m.subject || '') + ' ' + (m.body || '')).toLowerCase();
              if (hay.indexOf(q) >= 0 && (!fp || (m.project || '').toLowerCase() === fp)) sel.push(m);
            });
          } else {
            return 'Provide ids or a match keyword to select messages to move.';
          }
          if (!sel.length) return 'No matching messages found to move.';
          var moved = 0, skipped = 0, names = [];
          sel.forEach(function(m) {
            if ((m.project || '').toLowerCase() === targetId.toLowerCase()) { skipped++; return; }
            moveMessageToProject(m.id, targetId);
            moved++; names.push('"' + (m.subject || m.id).slice(0, 40) + '"');
          });
          return moved > 0
            ? ('Moved ' + moved + ' message(s) to ' + (tp.code || tp.name || targetId) + ': ' + names.join(', ') + (skipped ? ' (' + skipped + ' already there)' : ''))
            : ('No messages moved — ' + skipped + ' already in ' + (tp.code || targetId));
        }
      },
      {
        name: 'update_project_status',
        description: 'Change a project status (on-track, at-risk, blocked, delivered) and optionally log a reason.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID (e.g. p1, p2, p3)' },
            status: { type: 'string', enum: ['on-track', 'at-risk', 'blocked', 'delivered'], description: 'New status' },
            reason: { type: 'string', description: 'Optional reason for the change' }
          },
          required: ['project', 'status']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var old = p.status;
          p.status = _normalizeStatus(input.status);
          dleLogDecision({ action_type: 'status_change', item_type: 'project_status', project: p.id, detail: old + ' → ' + p.status + (input.reason ? ' — ' + input.reason : '') });
          // Persist to config/projects-* doc only — state/dashboard is Scout's domain
          if (_db && _projectsLoadedFromDb) {
            _db.doc('config/projects-' + p.id).update({ status: p.status }).catch(function(e) { console.warn('[CMD] Project config save failed:', e); });
          }
          renderOverview(); if (currentProject) renderDetailBody();
          return p.name + ' status changed: ' + old + ' → ' + p.status;
        }
      },
      {
        name: 'log_decision',
        description: 'Log a decision or note for a project. Recorded in the DLE decision log and persisted to the database.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID' },
            text: { type: 'string', description: 'The decision or note text' },
            type: { type: 'string', description: 'Decision type (e.g. go-decision, risk-accept, scope-change, note)', enum: ['go-decision', 'risk-accept', 'scope-change', 'partnership', 'budget', 'note'] }
          },
          required: ['project', 'text']
        },
        execute: function(input) {
          var decType = input.type || 'note';
          var nowIso = new Date().toISOString();
          dleLogDecision({ action_type: decType, item_type: 'manual_decision', project: input.project, detail: input.text });
          dbLogDecision({ project: input.project, type: decType, text: input.text, source: 'command-panel', at: nowIso });
          // Push to in-memory store so it shows in Activity immediately
          dleState._persistedDecisions.push({ project: input.project, type: decType, text: input.text, at: nowIso, source: 'command-panel', item_type: 'manual_decision' });
          if (currentProject) renderDetailBody();
          return 'Decision logged for ' + input.project + ': [' + decType + '] ' + input.text;
        }
      },
      {
        name: 'mark_milestone_delivered',
        description: 'Mark a project milestone as delivered.',
        inputSchema: {
          type: 'object',
          properties: {
            milestone_id: { type: 'string', description: 'Milestone ID or name' },
            project: { type: 'string', description: 'Project ID' }
          },
          required: ['milestone_id', 'project']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var ms = (p.milestones || []).find(function(m) {
            return (m.id || m.name) === input.milestone_id || m.name.toLowerCase() === input.milestone_id.toLowerCase();
          });
          if (!ms) return 'Milestone not found: ' + input.milestone_id + ' in ' + p.name;
          markMilestoneDelivered(ms.id || ms.name, p.id, ms.date, ms.name);
          return 'Milestone "' + ms.name + '" marked as delivered for ' + p.name;
        }
      },
      {
        name: 'update_deliverable',
        description: 'Update the status of a deliverable within a project milestone.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID' },
            deliverable_name: { type: 'string', description: 'Deliverable name (or partial match)' },
            status: { type: 'string', enum: ['pending', 'in-progress', 'delivered', 'blocked'], description: 'New status' }
          },
          required: ['project', 'deliverable_name', 'status']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var q = input.deliverable_name.toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();
          var found = null; var foundMs = null;
          (p.milestones || []).forEach(function(m) {
            (m.deliverables || []).forEach(function(d) {
              if (found) return;
              var dId = (d.id || '').toLowerCase().replace(/[-_]/g, ' ');
              var dTitle = (d.title || d.name || '').toLowerCase();
              // Match by ID (exact or prefix), title substring, or name substring
              if (dId === q || dId.indexOf(q) === 0 || q.indexOf(dId) === 0
                  || dTitle === q || dTitle.indexOf(q) >= 0 || q.indexOf(dTitle.split(' — ')[0].trim()) >= 0) {
                found = d; foundMs = m;
              }
            });
          });
          if (!found) {
            var allDels = [];
            (p.milestones || []).forEach(function(m) {
              (m.deliverables || []).forEach(function(d) {
                allDels.push((d.id || '?') + ' "' + (d.title || d.name || '?') + '" (' + m.name + ')');
              });
            });
            return 'Deliverable not found: ' + input.deliverable_name + ' in ' + p.name + '. Available: ' + allDels.join('; ');
          }
          var label = found.title || found.name || found.id;
          var old = found.status || 'pending';
          found.status = _normalizeStatus(input.status);
          found.lastUpdate = TODAY_STR;
          dleLogDecision({ action_type: 'deliverable_update', item_type: 'deliverable', project: p.id, detail: label + ': ' + old + ' → ' + found.status });
          if (_db && _projectsLoadedFromDb) {
            _db.doc('config/projects-' + p.id).update({ milestones: p.milestones }).catch(function(e) { console.warn('[CMD] Project config save failed:', e); });
          }
          renderOverview(); if (currentProject) renderDetailBody();
          return (found.id ? found.id + ' ' : '') + label + ' status: ' + old + ' → ' + found.status;
        }
      },
      {
        name: 'add_deliverable',
        description: 'Add a new deliverable to a project milestone. Persists to config/projects-* DB document.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID (p1, p2, p3)' },
            milestone_id: { type: 'string', description: 'Milestone ID or name to add the deliverable under' },
            title: { type: 'string', description: 'Deliverable title' },
            status: { type: 'string', enum: ['pending', 'in_progress', 'on_track', 'delivered', 'blocked'], description: 'Initial status (default: pending)' },
            due: { type: 'string', description: 'Due date in YYYY-MM-DD format (optional)' }
          },
          required: ['project', 'milestone_id', 'title']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var ms = (p.milestones || []).find(function(m) {
            return (m.id || m.name) === input.milestone_id || m.name.toLowerCase() === input.milestone_id.toLowerCase();
          });
          if (!ms) return 'Milestone not found: ' + input.milestone_id + ' in ' + p.name + '. Available: ' + (p.milestones || []).map(function(m) { return m.id + ' (' + m.name + ')'; }).join(', ');
          if (!ms.deliverables) ms.deliverables = [];
          // Generate next ID: find highest CW-E/CW-D number and increment
          var maxNum = 0;
          (p.milestones || []).forEach(function(m) {
            (m.deliverables || []).forEach(function(d) {
              var match = (d.id || '').match(/CW-[A-Z](\d+)/);
              if (match) maxNum = Math.max(maxNum, parseInt(match[1], 10));
            });
          });
          var newId = 'CW-E' + (maxNum + 1);
          var newDel = {
            id: newId,
            title: input.title,
            status: input.status ? _normalizeStatus(input.status) : 'pending',
            lastUpdate: TODAY_STR,
            source: 'Local'
          };
          if (input.due) newDel.due = input.due;
          ms.deliverables.push(newDel);
          dleLogDecision({ action_type: 'deliverable_add', item_type: 'deliverable', project: p.id, detail: newDel.title + ' added to ' + ms.name + ' (' + newId + ')' });
          // Persist to config/projects-* doc
          if (_db && _projectsLoadedFromDb) {
            _db.doc('config/projects-' + p.id).update({ milestones: p.milestones }).catch(function(e) { console.warn('[CMD] Project config save failed:', e); });
          }
          renderOverview(); if (currentProject) renderDetailBody();
          return 'Added deliverable "' + newDel.title + '" (' + newId + ') to ' + ms.name + ' — status: ' + newDel.status + (newDel.due ? ', due: ' + newDel.due : '');
        }
      },
      {
        name: 'bulk_update_milestone',
        description: 'Update status of ALL deliverables under a specific milestone in one go. Useful for marking all items delivered after a review gate.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID (p1, p2, p3)' },
            milestone: { type: 'string', description: 'Milestone ID or name (e.g. "TRR", "CDR", "PDR")' },
            status: { type: 'string', enum: ['pending', 'in_progress', 'on_track', 'delivered', 'blocked'], description: 'New status for all deliverables' },
            exclude_ids: { type: 'array', items: { type: 'string' }, description: 'Optional list of deliverable IDs to skip' },
            only_statuses: { type: 'array', items: { type: 'string' }, description: 'Optional: only update deliverables currently in these statuses (e.g. ["on_track","pending"])' }
          },
          required: ['project', 'milestone', 'status']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var q = input.milestone.toLowerCase();
          var ms = (p.milestones || []).find(function(m) {
            var mid = (m.id || '').toLowerCase();
            var mname = (m.name || '').toLowerCase();
            return mid === q || mname === q || mname.indexOf(q) >= 0 || mid.indexOf(q) >= 0;
          });
          if (!ms) return 'Milestone not found: ' + input.milestone + ' in ' + p.name + '. Available: ' + (p.milestones || []).map(function(m) { return (m.id || m.name) + ' (' + m.name + ')'; }).join(', ');
          var excludeSet = {};
          (input.exclude_ids || []).forEach(function(id) { excludeSet[id.toLowerCase()] = true; });
          var onlyStatuses = null;
          if (input.only_statuses && input.only_statuses.length) {
            onlyStatuses = {};
            input.only_statuses.forEach(function(s) { onlyStatuses[_normalizeStatus(s)] = true; });
          }
          var newStatus = _normalizeStatus(input.status);
          var updated = []; var skipped = [];
          (ms.deliverables || []).forEach(function(d) {
            if (excludeSet[(d.id || '').toLowerCase()]) { skipped.push(d.id); return; }
            if (onlyStatuses && !onlyStatuses[d.status || 'pending']) { skipped.push(d.id + ' (status: ' + d.status + ')'); return; }
            var old = d.status || 'pending';
            if (old === newStatus) { skipped.push(d.id + ' (already ' + newStatus + ')'); return; }
            d.status = newStatus;
            d.lastUpdate = TODAY_STR;
            updated.push(d.id + ' ' + (d.title || d.name || '') + ': ' + old + ' → ' + newStatus);
          });
          if (updated.length) {
            dleLogDecision({ action_type: 'bulk_deliverable_update', item_type: 'milestone', project: p.id, detail: 'Bulk ' + newStatus + ' for ' + ms.name + ': ' + updated.length + ' deliverables updated' });
            if (_db && _projectsLoadedFromDb) {
              _db.doc('config/projects-' + p.id).update({ milestones: p.milestones }).catch(function(e) { console.warn('[CMD] Bulk save failed:', e); });
            }
            renderOverview(); if (currentProject) renderDetailBody();
          }
          var result = 'Updated ' + updated.length + ' deliverable(s) under ' + ms.name + ' to ' + newStatus + ':\n' + updated.join('\n');
          if (skipped.length) result += '\nSkipped: ' + skipped.join(', ');
          return result;
        }
      },
      {
        name: 'update_project',
        description: 'Update any field on a project config (notes, priority, milestones, etc.). Persists to config/projects-* DB document. recentActivity is managed by Scout — use state/dashboard instead.',
        inputSchema: {
          type: 'object',
          properties: {
            project: { type: 'string', description: 'Project ID (p1, p2, p3)' },
            fields: { type: 'object', description: 'Object of fields to update. E.g. { notes: "...", priority: 2 }. Can include: notes, priority, status, milestones (array), partners (array), contract, prime, stream, name.' }
          },
          required: ['project', 'fields']
        },
        execute: function(input) {
          var p = projects.find(function(x) { return x.id.toLowerCase() === input.project.toLowerCase(); });
          if (!p) return 'Project not found: ' + input.project;
          var updated = [];
          var safe = ['notes', 'priority', 'status', 'milestones', 'partners', 'contract', 'prime', 'stream', 'name', 'code', 'dataSources', 'maturity', 'sensitivity'];
          Object.keys(input.fields).forEach(function(k) {
            if (safe.indexOf(k) === -1) return;
            var val = input.fields[k];
            if (k === 'status') val = _normalizeStatus(val);
            p[k] = val;
            updated.push(k);
          });
          if (!updated.length) return 'No valid fields to update. Allowed: ' + safe.join(', ');
          // Ensure milestones have deliverables arrays
          if (input.fields.milestones) {
            (p.milestones || []).forEach(function(m) { m.deliverables = m.deliverables || []; });
          }
          dleLogDecision({ action_type: 'project_update', item_type: 'project_config', project: p.id, detail: 'Updated: ' + updated.join(', ') });
          // Persist to config/projects-* doc
          if (_db && _projectsLoadedFromDb) {
            _db.doc('config/projects-' + p.id).update(input.fields).catch(function(e) { console.warn('[CMD] Project config save failed:', e); });
          }
          renderOverview(); if (currentProject) { renderDetailTabs(); renderDetailBody(); }
          return p.name + ': updated ' + updated.join(', ');
        }
      },
      {
        name: 'dismiss_attention',
        description: 'Dismiss an attention item from the DLE attention list (hidden for 48h).',
        inputSchema: {
          type: 'object',
          properties: {
            item_id: { type: 'string', description: 'Attention item ID' },
            project: { type: 'string', description: 'Project ID (for logging)' }
          },
          required: ['item_id']
        },
        execute: function(input) {
          _dismissedItems[input.item_id] = Date.now();
          dleLogDecision({ action_type: 'attention_dismiss', item_type: 'attention', project: input.project || 'unknown', detail: 'cmd dismiss: ' + input.item_id });
          dbSaveDismissals();
          renderOverview();
          return 'Dismissed attention item: ' + input.item_id + ' (hidden for 48h)';
        }
      },
      {
        name: 'check_calendar',
        description: 'Search the user\'s Outlook calendar for events. Returns meetings/events matching the query and date range. Use for questions like "what meetings do I have tomorrow", "any Project Alpha meetings this week", etc.',
        inputSchema: {
          type: 'object',
          properties: {
            query: { type: 'string', description: 'Search query (e.g. "review", "standup", or empty for all events)' },
            after: { type: 'string', description: 'Start of date range. Natural language OK, e.g. "today", "2026-09-28", "next Monday"' },
            before: { type: 'string', description: 'End of date range. Natural language OK, e.g. "tomorrow", "end of week", "2026-10-02"' },
            limit: { type: 'number', description: 'Max events to return (default 10, max 25)' }
          }
        },
        execute: async function(input) {
          if (!_mcp) return 'Calendar not available — Microsoft 365 connector not connected in this view.';
          try {
            var args = {};
            if (input.query) args.query = input.query;
            if (input.after) args.afterDateTime = input.after;
            if (input.before) args.beforeDateTime = input.before;
            args.limit = input.limit || 10;
            args.order = 'oldest';
            var result = await _mcp.callTool(CONNECTOR_M365, 'outlook_calendar_search', args);
            return result.payload || result.text || JSON.stringify(result);
          } catch(e) {
            console.warn('[CMD] Calendar search error:', e);
            return 'Calendar search failed: ' + (e.message || e.code || 'unknown error');
          }
        }
      },
      {
        name: 'find_free_time',
        description: 'Find available time slots in the user\'s calendar. Returns free windows for scheduling. Use for "when am I free", "find time for a 30-min meeting this week", etc. Dates must be ISO 8601 UTC.',
        inputSchema: {
          type: 'object',
          properties: {
            after: { type: 'string', description: 'Start of search window as ISO 8601 UTC (e.g. "2026-09-28T08:00:00Z"). Required.' },
            before: { type: 'string', description: 'End of search window as ISO 8601 UTC (e.g. "2026-09-30T18:00:00Z"). Required.' },
            duration_minutes: { type: 'number', description: 'Desired meeting length in minutes (default 60)' },
            participants: { type: 'array', items: { type: 'string' }, description: 'Email addresses of other participants (optional — omit to check only your calendar)' },
            max_slots: { type: 'number', description: 'Max number of free slots to return (default 10, max 50)' }
          },
          required: ['after', 'before']
        },
        execute: async function(input) {
          if (!_mcp) return 'Calendar not available — Microsoft 365 connector not connected in this view.';
          try {
            var args = {
              afterDateTime: input.after,
              beforeDateTime: input.before,
              durationMinutes: input.duration_minutes || 60,
              maxCandidates: input.max_slots || 10
            };
            if (input.participants && input.participants.length) {
              args.participants = input.participants;
            }
            var result = await _mcp.callTool(CONNECTOR_M365, 'outlook_find_available_time', args);
            return result.payload || result.text || JSON.stringify(result);
          } catch(e) {
            console.warn('[CMD] Free time search error:', e);
            return 'Free time search failed: ' + (e.message || e.code || 'unknown error');
          }
        }
      }
    ];
  }

  // ── Send handler ──
  async function doSend() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', escHtml(text));

    // Try local command first
    var localResult = tryLocalCommand(text);
    if (localResult !== null) {
      addMsg('assistant', localResult);
      return;
    }

    // Fall back to Claude sample
    if (!_sample) {
      if (_sampleFailed) {
        addMsg('system', 'Claude not available in this view — try a local command (<code>help</code> for list)');
      } else {
        addMsg('system', 'Claude is still loading — try again in a moment');
      }
      return;
    }

    // Abort any in-flight request
    if (_abortCtl) { try { _abortCtl.abort(); } catch(e) {} }
    _abortCtl = new AbortController();

    var msgEl = addMsg('assistant', '<span class="cmd-thinking">Thinking...</span>');
    sendBtn.disabled = true;

    try {
      // Build conversation with system context
      var systemMsg = buildContext() + '\nAnswer concisely. Use markdown sparingly — short plain-text answers preferred. When the user asks you to do something (ack, change status, log a decision, etc), use the available tools. After using a tool, briefly confirm what you did. When the user asks for info, answer from the context above.';
      var turns = [{ role: 'user', content: systemMsg }];
      // Add recent chat history (keep last 6 exchanges)
      var recentTurns = _chatTurns.slice(-12);
      recentTurns.forEach(function(t) { turns.push(t); });
      turns.push({ role: 'user', content: text });

      var result = await _sample(turns, {
        signal: _abortCtl.signal,
        modelTier: 'quick',
        cache: false,
        tools: buildSampleTools(),
        onText: function(update) {
          msgEl.innerHTML = formatResponse(update.text);
          scrollBody();
        }
      });

      msgEl.innerHTML = formatResponse(result.text);
      // Save to chat history
      _chatTurns.push({ role: 'user', content: text });
      _chatTurns.push({ role: 'assistant', content: result.text });
      // Trim history
      if (_chatTurns.length > 16) _chatTurns = _chatTurns.slice(-12);

    } catch(e) {
      if (e.code === 'cancelled') {
        msgEl.innerHTML = e.text ? formatResponse(e.text) + '<br><em style="color:var(--ink-muted)">Stopped</em>' : '<em style="color:var(--ink-muted)">Stopped</em>';
      } else if (e.code === 'not_granted') {
        msgEl.innerHTML = 'Claude access not granted — use local commands (<code>help</code>)';
        _sampleFailed = true;
      } else if (e.code === 'rate_limited') {
        msgEl.innerHTML = (e.text ? formatResponse(e.text) + '<br>' : '') + '<em style="color:var(--status-at-risk)">Rate limited — try again shortly</em>';
      } else {
        msgEl.innerHTML = '<em style="color:var(--status-blocked)">Error: ' + escHtml(e.code || 'unknown') + '</em>';
        console.warn('[CMD] Sample error:', e);
      }
    } finally {
      sendBtn.disabled = false;
      _abortCtl = null;
      scrollBody();
    }
  }

  // Simple markdown-ish formatting for Claude responses
  function formatResponse(text) {
    var s = escHtml(text);
    // Bold
    s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code style="background:var(--surface-active);padding:1px 4px;border-radius:3px;font-size:11px">$1</code>');
    // Code blocks
    s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre>$1</pre>');
    // Line breaks
    s = s.replace(/\n/g, '<br>');
    return s;
  }
})();

</script>
